# =============================================================================
# Auth Stack - Complete Authentication & Authorization Helm Chart
# =============================================================================

# =============================================================================
# Global Configuration
# =============================================================================
global:
  # Base domain - all URLs are derived from this
  domain: example.com
  # Override if auth domain differs from auth.<domain>
  # authDomain: auth.example.com
  # Override if app domain differs from app.<domain>
  # appDomain: app.example.com
  imagePullSecrets: []

  # Vault configuration (Banzai Cloud) - annotations auto-injected when enabled
  vault:
    enabled: false
    address: http://vault.vault:8200
    role: ""
    envFromPath: ""
  audit:
    webhook:
      secret: vault:secret/data/auth#KRATOS_WEBHOOK_SECRET
      url: http://{{ .Release.Name }}-jinbe:8080/api/webhooks/kratos


nameOverride: ""
fullnameOverride: ""

# =============================================================================
# Kratos - Identity Management (Ory)
# =============================================================================
kratos:
  enabled: true

  # ServiceAccount is created by auth chart (templates/kratos/serviceaccount.yaml)
  # with automountServiceAccountToken: true for Vault integration
  deployment:
    serviceAccount:
      create: false  # Disabled - SA created by parent chart with automount enabled
      name: kratos
      annotations: {}
    automountServiceAccountToken: true
    # extraEnv is tpl-rendered by the kratos subchart, so {{ .Release.Name }}
    # resolves to the actual release at install time. Used here to wire the
    # DSN against the bundled postgres Service ({release}-postgresql) without
    # forcing every consumer to copy/paste the DSN into a per-env overlay.
    # Override the entire entry (or set kratos.kratos.config.dsn) if you point
    # Kratos at an external database.
    extraEnv:
      - name: DSN
        value: "postgresql://kratos:kratos@{{ .Release.Name }}-postgresql:5432/kratos?sslmode=disable"

  ingress:
    public:
      enabled: false  # Traffic routed through Oathkeeper

  kratos:
    automountServiceAccountToken: true
    config:
      # ─── Database (DSN) ───────────────────────────────────────────────────
      # The chart bundles a simple postgresql StatefulSet (postgresqlSimple)
      # whose Service is `<release>-postgresql:5432`. The default DSN below
      # assumes you install with `helm install auth ./auth`, producing service
      # `auth-postgresql`. Override `kratos.kratos.config.dsn` if your release
      # name differs OR you point at an external DB.
      #
      # Plug-and-play options:
      #   - Bundled simple postgres (default):
      #       dsn: postgresql://kratos:kratos@auth-postgresql:5432/kratos?sslmode=disable
      #
      #   - SQLite (single-instance, dev or low-traffic; data persists in PVC):
      #       dsn: sqlite:///var/lib/kratos/kratos.sqlite?_fk=true&mode=rwc
      #     (also disable postgresqlSimple, mount a PVC at /var/lib/kratos
      #      via kratos.deployment.extraVolumes/extraVolumeMounts)
      #     Reference: https://www.ory.sh/docs/hydra/self-hosted/dependencies-environment#sqlite
      #
      #   - External Postgres / RDS / Cloud SQL:
      #       dsn: postgresql://USER:PASS@HOST:5432/DB?sslmode=require
      #
      #   - In-memory (state lost on pod restart — testing only):
      #       dsn: memory
      #
      # Leave empty here and feed DSN via deployment.extraEnv below so the
      # release name (which the bundled postgres Service is prefixed with)
      # is interpolated at install time — keeps the default plug-and-play
      # regardless of `helm install <whatever> ...`.
      dsn: ""

      # ─── Cryptographic secrets ────────────────────────────────────────────
      # Ory schema constraints:
      #   default[*]  — min 16 chars
      #   cookie[*]   — min 16 chars (used to sign session cookies)
      #   cipher[*]   — exactly 32 chars (XChaCha20-Poly1305 key)
      # PROD: rotate via vault and pass via Vault sidecar / external secrets.
      # Examples below are deterministic placeholders, NOT for production use.
      secrets:
        default:
          - changeme-default-secret-16chars
        cookie:
          - changeme-cookie-secret-16chars0
        cipher:
          - changeme-this-cipher-secret-32cc
      identity:
        default_schema_id: default
        schemas:
          - id: default
            url: file:///etc/config/person.schema.json
      serve:
        public:
          base_url: https://auth.example.com/
          cors:
            enabled: true
            allowed_origins:
              - https://auth.example.com
              - https://app.example.com
      session:
        # Session extender: jinbe's whoami calls PATCH /admin/sessions/{id}/extend
        # (best-effort). earliest_possible_extend MUST be < lifespan so active users
        # keep a sliding session with minimal Set-Cookie churn.
        lifespan: 24h
        earliest_possible_extend: 1h
        cookie:
          domain: example.com
          same_site: Lax
          persistent: true
        # Keep AAL1 sessions valid for cross-subdomain whoami checks.
        # Kratos >=0.11 defaults to highest_available, which forces every
        # session check to demand AAL2 as soon as the user enrols TOTP
        # or WebAuthn — breaking SSO across tenant subdomains. Step-up
        # still happens on privileged self-service flows (settings) via
        # privileged_session_max_age below.
        whoami:
          required_aal: aal1
      selfservice:
        # Wildcard covers every tenant subdomain of {domain}. Kratos
        # globs are supported since v0.10, and kratos-login-ui's
        # regex-translated matcher accepts the same pattern.
        allowed_return_urls:
          - https://*.example.com
          - http://*.example.com
        default_browser_return_url: https://app.example.com
        methods:
          password:
            enabled: true
          oidc:
            enabled: false
            config:
              providers: []
        flows:
          error:
            ui_url: https://auth.example.com/auth/error
          settings:
            ui_url: https://auth.example.com/auth/settings
            privileged_session_max_age: 15m
            # ── Audit webhook (auth events → jinbe) ────────────────────────────
            # After each settings change Kratos POSTs a compact auth event to the
            # jinbe audit sink. Per-method hooks (password / profile / totp /
            # webauthn / lookup_secret) each stamp the correct `method`; MFA
            # enrol/remove is captured via the totp/webauthn/lookup_secret
            # entries. Per-method (not the global `after.hooks`) is used on
            # purpose so each event carries its method AND so an update never
            # fires the hook twice. The `body` is a base64:// Jsonnet template —
            # function(ctx){...} — emitting ONLY
            # {flow,identity_id,identity_email,method,ip,ua}: no secrets, no
            # traits blob. `response.ignore: true` makes the call fire-and-forget
            # so a slow or down jinbe can never block the user's flow. The
            # api_key `value` is a Vault reference (never a literal secret) and
            # MUST resolve to the same value as jinbe's KRATOS_WEBHOOK_SECRET env.
            # url / method / response / auth are YAML-anchored here and reused by
            # the login and registration hooks below (Helm expands the anchors).
            after:
              password:
                hooks:
                  - hook: web_hook
                    config:
                      url: '{{ .Values.global.audit.webhook.url }}'
                      method: &auditWebhookMethod POST
                      body: 'base64:'
                      response: &auditWebhookResponse
                        ignore: true
                      auth:
                        type: api_key
                        config:
                          name: X-Kratos-Webhook-Secret
                          in: header
                          value: '{{ .Values.global.audit.webhook.secret }}'
              profile:
                hooks:
                  - hook: web_hook
                    config:
                      url: '{{ .Values.global.audit.webhook.url }}'
                      method: *auditWebhookMethod
                      body: 'base64:'
                      response: *auditWebhookResponse
                      auth:
                        type: api_key
                        config:
                          name: X-Kratos-Webhook-Secret
                          in: header
                          value: '{{ .Values.global.audit.webhook.secret }}'
              totp:
                hooks:
                  - hook: web_hook
                    config:
                      url: '{{ .Values.global.audit.webhook.url }}'
                      method: *auditWebhookMethod
                      body: 'base64:'
                      response: *auditWebhookResponse
                      auth:
                        type: api_key
                        config:
                          name: X-Kratos-Webhook-Secret
                          in: header
                          value: '{{ .Values.global.audit.webhook.secret }}'
              webauthn:
                hooks:
                  - hook: web_hook
                    config:
                      url: '{{ .Values.global.audit.webhook.url }}'
                      method: *auditWebhookMethod
                      body: 'base64:'
                      response: *auditWebhookResponse
                      auth:
                        type: api_key
                        config:
                          name: X-Kratos-Webhook-Secret
                          in: header
                          value: '{{ .Values.global.audit.webhook.secret }}'
              lookup_secret:
                hooks:
                  - hook: web_hook
                    config:
                      url: '{{ .Values.global.audit.webhook.url }}'
                      method: *auditWebhookMethod
                      body: 'base64:'
                      response: *auditWebhookResponse
                      auth:
                        type: api_key
                        config:
                          name: X-Kratos-Webhook-Secret
                          in: header
                          value: '{{ .Values.global.audit.webhook.secret }}'
          recovery:
            enabled: true
          verification:
            enabled: true
          logout:
            after:
              default_browser_return_url: https://auth.example.com/auth/login
          login:
            ui_url: https://auth.example.com/auth/login
            lifespan: 10m
            # Audit webhook — emit an auth event to jinbe after every successful
            # login (any method). Reuses the anchored url/method/response/auth
            # defined in the settings flow above; see that block for the payload
            # shape and security notes.
            after:
              hooks:
                - hook: web_hook
                  config:
                    url: '{{ .Values.global.audit.webhook.url }}'
                    method: *auditWebhookMethod
                    body: 'base64:'
                    response: *auditWebhookResponse
                    auth:
                      type: api_key
                      config:
                        name: X-Kratos-Webhook-Secret
                        in: header
                        value: '{{ .Values.global.audit.webhook.secret }}'
          registration:
            lifespan: 10m
            ui_url: https://auth.example.com/auth/registration
            # Audit webhook — emit an auth event to jinbe after each successful
            # registration. Reuses the anchored url/method/response/auth from the
            # settings flow above.
            after:
              hooks:
                - hook: web_hook
                  config:
                    url: '{{ .Values.global.audit.webhook.url }}'
                    method: *auditWebhookMethod
                    body: 'base64:'
                    response: *auditWebhookResponse
                    auth:
                      type: api_key
                      config:
                        name: X-Kratos-Webhook-Secret
                        in: header
                        value: '{{ .Values.global.audit.webhook.secret }}'
      log:
        level: info
        format: json
      ciphers:
        algorithm: xchacha20-poly1305
      hashers:
        argon2:
          parallelism: 1
          memory: 128MB
          iterations: 2
          salt_length: 16
          key_length: 16
    # ─── Database migration ───────────────────────────────────────────────
    # initContainer runs migration inside the Kratos pod before the main
    # container starts, so it waits for Postgres readiness through normal
    # Pod lifecycle. The alternative (`type: job`) creates a Helm pre-install
    # hook that runs BEFORE chart resources, deadlocking fresh installs that
    # bundle their own postgres (hook waits for DB, DB hasn't been deployed
    # yet). InitContainer is idempotent and safe for already-migrated DBs.
    automigration:
      enabled: true
      type: initContainer

    # Example identity schemas - customize for your use case.
    # The default schema declares the email trait as the identifier for
    # password, totp account_name, and webauthn — all three are required
    # for those flows to attach correctly. Without `totp.account_name`
    # the QR/secret would have no human-readable label; without
    # `webauthn.identifier` registering a security key fails.
    identitySchemas:
      person.schema.json: |
        {
          "$id": "https://schemas.example.com/person.schema.json",
          "$schema": "http://json-schema.org/draft-07/schema#",
          "title": "Person",
          "type": "object",
          "properties": {
            "traits": {
              "type": "object",
              "properties": {
                "email": {
                  "type": "string",
                  "format": "email",
                  "title": "Email",
                  "ory.sh/kratos": {
                    "credentials": {
                      "password": { "identifier": true },
                      "totp": { "account_name": true },
                      "webauthn": { "identifier": true }
                    },
                    "verification": { "via": "email" },
                    "recovery": { "via": "email" }
                  }
                },
                "name": { "type": "string", "title": "Name" }
              },
              "required": ["email"],
              "additionalProperties": false
            }
          }
        }

# =============================================================================
# authEmail - branded Kratos courier code emails (recovery + verification)
# =============================================================================
# Renders templates/kratos/email-templates.yaml into per-type ConfigMaps that
# Kratos mounts as courier template overrides. Disabled by default: leaving this
# off means Kratos uses its built-in default emails (safe, no ConfigMaps).
#
# To ENABLE in a values overlay you must set THREE things together (kept in the
# overlay, not here, so the chart is inert by default):
#   1. authEmail.enabled: true (+ bannerUrl / brandName / subject below)
#   2. kratos.kratos.config.courier.template_override_path: /conf/courier-templates
#   3. kratos.statefulSet.extraVolumes + extraVolumeMounts mounting each
#      ConfigMap ({release}-email-recovery-code-valid / -verification-code-valid)
#      at /conf/courier-templates/<recovery_code|verification_code>/valid
authEmail:
  # Renders branded Kratos courier templates as ConfigMaps for all seven flows:
  # login/registration/recovery/verification code-valid emails, the recovery /
  # verification "invalid" notices, and the verifiable-address-changed alert.
  # Mount them via kratos.statefulSet/deployment extraVolumes+extraVolumeMounts
  # under courier.template_override_path. Disabled -> Kratos built-in defaults.
  enabled: false
  # Public https URL of the banner image. Must be reachable by the recipient's
  # mail client (email clients block data: URIs). Empty -> a text brand header
  # is used instead of an <img>.
  bannerUrl: ""
  # Brand name for the <img alt> / text-header fallback and body copy
  # (replaces the BRAND_NAME token in the bodies).
  brandName: ""
  # Support contact email shown in the body/footer (replaces SUPPORT_EMAIL).
  supportEmail: ""
  # Optional single subject applied to every flow. Leave empty to use the
  # per-flow subjects (e.g. "Votre code de connexion <brandName>", the
  # address-changed alert has its own subject, etc.).
  subject: ""

# =============================================================================
# Oathkeeper - API Gateway (Ory)
# =============================================================================
# helmTemplatedConfigEnabled allows {{ .Release.Name }} in oathkeeper.config.
# The tpl runs in the SUBCHART context, so only .Release.Name/.Namespace are
# available -- parent-chart includes and .Values are NOT accessible.
# Oathkeeper's own Go template syntax ({{ .Subject }}, etc.) is escaped with
# {{ "{{" }} ... {{ "}}" }} to survive the tpl pass.
oathkeeper:
  enabled: true

  # rules-sync sidecar — hot-reload Oathkeeper access rules with NO restart / NO GitOps.
  # A blocking init does the first fetch of jinbe's rules into a shared emptyDir file
  # (/etc/rules/access-rules.json); a sidecar then polls jinbe and atomically replaces
  # that file only when it changes. Oathkeeper reads file:///etc/rules/access-rules.json
  # + fsnotify and reloads in place. The init/sidecar specs live under
  # oathkeeper.deployment.extra* below (tpl-rendered by the subchart).
  rulesSync:
    enabled: true
    url: ""                       # empty -> http://<release>-jinbe:8080/api/oathkeeper/rules
    intervalSeconds: 5
    initRetries: 30
    image: "curlimages/curl:8.11.1"

  deployment:
    # Blocking first fetch: guarantees /etc/rules/access-rules.json exists (seeds "[]"
    # fail-closed after initRetries). tpl-rendered in the subchart context.
    extraInitContainers: |
      {{- if .Values.rulesSync.enabled }}
      - name: rules-sync-init
        image: {{ .Values.rulesSync.image | quote }}
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -u
            URL="{{ .Values.rulesSync.url | default (printf "http://%s-jinbe:8080/api/oathkeeper/rules" .Release.Name) }}"
            DEST=/etc/rules/access-rules.json
            TMP=/etc/rules/.access-rules.init
            MAX={{ .Values.rulesSync.initRetries | default 30 }}
            n=0
            until curl -fsS --max-time 5 "$URL" -o "$TMP"; do
              n=$((n+1))
              if [ "$n" -ge "$MAX" ]; then
                echo "rules-sync-init: jinbe unreachable after ${n} tries; seeding [] (fail-closed)"
                printf '[]' > "$TMP"; mv "$TMP" "$DEST"; exit 0
              fi
              echo "rules-sync-init: fetch failed (try ${n}/${MAX}), retry in 2s"
              sleep 2
            done
            [ -s "$TMP" ] || printf '[]' > "$TMP"
            mv "$TMP" "$DEST"
            echo "rules-sync-init: wrote initial rules to ${DEST}"
        volumeMounts:
          - name: {{ include "oathkeeper.name" . }}-rules-volume
            mountPath: /etc/rules
            readOnly: false
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities: { drop: ["ALL"] }
          seccompProfile: { type: RuntimeDefault }
      {{- end }}
    # Sidecar: poll jinbe every intervalSeconds; atomically mv only on sha256 change
    # (no fsnotify churn / needless reloads). Logs on change.
    extraContainers: |
      {{- if .Values.rulesSync.enabled }}
      - name: rules-sync
        image: {{ .Values.rulesSync.image | quote }}
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -u
            URL="{{ .Values.rulesSync.url | default (printf "http://%s-jinbe:8080/api/oathkeeper/rules" .Release.Name) }}"
            DEST=/etc/rules/access-rules.json
            TMP=/etc/rules/.access-rules.next
            INTERVAL={{ .Values.rulesSync.intervalSeconds | default 5 }}
            echo "rules-sync: polling ${URL} every ${INTERVAL}s -> ${DEST}"
            while true; do
              if curl -fsS --max-time 5 "$URL" -o "$TMP"; then
                if [ -s "$TMP" ]; then
                  new=$(sha256sum "$TMP" | cut -d' ' -f1)
                  cur=$(sha256sum "$DEST" 2>/dev/null | cut -d' ' -f1 || echo none)
                  if [ "$new" != "$cur" ]; then
                    mv "$TMP" "$DEST"
                    echo "rules-sync: rules changed -> updated ${DEST} (sha256=${new})"
                  fi
                fi
              else
                echo "rules-sync: fetch failed, keeping current rules"
              fi
              sleep "$INTERVAL"
            done
        volumeMounts:
          - name: {{ include "oathkeeper.name" . }}-rules-volume
            mountPath: /etc/rules
            readOnly: false
        livenessProbe:
          exec: { command: ["/bin/sh", "-c", "test -f /etc/rules/access-rules.json"] }
          initialDelaySeconds: 10
          periodSeconds: 30
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits:   { memory: 32Mi }
      {{- end }}

  oathkeeper:
    helmTemplatedConfigEnabled: true
    # Rules come as a file in an emptyDir from the rules-sync sidecar (NOT a ConfigMap).
    # managedAccessRules MUST stay false so the subchart mounts /etc/rules as an emptyDir
    # + runs its built-in init, instead of mounting a rules ConfigMap. Keep
    # accessRulesOverride.nameOverride empty (default) for the same reason.
    managedAccessRules: false
    config:
      # CORS is delegated to ingress-nginx via the Ingress annotations
      # (see oathkeeper.ingress.proxy.annotations below). Ingress-nginx
      # is the only layer that can attach Access-Control-* headers to
      # error responses (401/403/500), which oathkeeper's rs/cors
      # middleware skips. Disabling here avoids duplicate headers from
      # two layers — browsers reject responses with two
      # Access-Control-Allow-Origin values.
      serve:
        proxy:
          cors:
            enabled: false
      access_rules:
        matching_strategy: regexp
        # File mode + fsnotify hot-reload. The rules-sync sidecar (oathkeeper.rulesSync
        # below) polls jinbe and atomically rewrites this file on change, so Oathkeeper
        # reloads rules with NO pod restart. (An HTTP repo is fetched ONCE at boot,
        # which is why serving rules over HTTP required an Oathkeeper restart.)
        repositories:
          - file:///etc/rules/access-rules.json
      authenticators:
        cookie_session:
          enabled: true
          config:
            check_session_url: 'http://{{ .Release.Name }}-kratos-public:80/sessions/whoami'
            preserve_path: true
            extra_from: "@this"
            subject_from: "identity.id"
            only:
              - ory_kratos_session
        noop:
          enabled: true
      authorizers:
        allow:
          enabled: true
        deny:
          enabled: true
        remote_json:
          enabled: true
          config:
            # /decision returns {allow, groups}. opa-authz-proxy emits
            # X-User-Groups from the server-side bindings (Redis via OPAL),
            # which the line below forwards to the upstream. This keeps
            # Kratos metadata_admin private (it is never exposed through
            # /sessions/whoami) while still giving upstreams the user's
            # groups header. Groups in the payload are intentionally
            # omitted — OPA reads them from data.bindings.group_membership.
            #
            # Oathkeeper template syntax is escaped with {{ "{{" }} ... {{ "}}" }}
            # so it survives the chart's tpl pass (helmTemplatedConfigEnabled
            # only resolves Helm directives like .Release.Name) and reaches
            # oathkeeper intact for per-request evaluation.
            remote: 'http://{{ .Release.Name }}-opa-authz-proxy:8080/v1/data/rbac/decision'
            payload: |
              {
                "input": {
                  "sub": "{{ "{{" }} print .Subject {{ "}}" }}",
                  "email": "{{ "{{" }} if .Extra.identity {{ "}}" }}{{ "{{" }} index .Extra.identity.traits "email" {{ "}}" }}{{ "{{" }} end {{ "}}" }}",
                  "object": "{{ "{{" }} .MatchContext.URL.Path {{ "}}" }}",
                  "action": "{{ "{{" }} .MatchContext.Method {{ "}}" }}"
                }
              }
            forward_response_headers_to_upstream:
              - X-User-Groups
      mutators:
        noop:
          enabled: true
        header:
          enabled: true
          config:
            # Header names use canonical case. Go's net/http canonicalizes
            # them anyway; defining the same header under both X-User-Id
            # and x-user-id produces a non-deterministic Set() race.
            # X-User-Groups is intentionally NOT set here — it comes from
            # the remote_json authorizer (server-side trusted source) via
            # forward_response_headers_to_upstream. The email template is
            # nil-safe so requests reaching this rule via the noop fallback
            # authenticator (no session) don't crash.
            headers:
              x-user-id: '{{ "{{" }} print .Subject {{ "}}" }}'
              x-user-email: '{{ "{{" }} if .Extra.identity {{ "}}" }}{{ "{{" }} index .Extra.identity.traits "email" {{ "}}" }}{{ "{{" }} end {{ "}}" }}'
      errors:
        # `unauthorized` (no Kratos session) is the only error that
        # still triggers a cross-host redirect to the login page —
        # everything else (`forbidden`, missing route_map match,
        # rule miss) returns the upstream status and lets
        # ingress-nginx hand the request over to the in-chart
        # error-page Service via custom-http-errors. That keeps
        # `kuma.{domain}/x` showing a 403 page on kuma.{domain}
        # rather than redirecting to auth.{domain}/login, which
        # used to cause an AAL2 step-up loop for already-logged-in
        # users hitting a route they don't have permission for.
        fallback: [redirect, json]
        handlers:
          redirect:
            enabled: true
            config:
              # Resolved against global.{domain,authDomain} via the chart's
              # tpl pass (helmTemplatedConfigEnabled). Oathkeeper appends
              # the original URL as ?return_to=... when return_to_query_param
              # is set, so the hard-coded query string from the upstream
              # chart's example is dropped.
              to: 'https://{{ default (printf "auth.%s" .Values.global.domain) .Values.global.authDomain }}/login'
              return_to_query_param: return_to
              when:
                - error: [unauthorized]
                  request:
                    header:
                      accept: [text/html]
          json:
            enabled: true
            config:
              verbose: false

  ingress:
    proxy:
      enabled: true
      className: ""
      # ingress-nginx is the canonical CORS source. Annotations below
      # cover ALL responses (including 401/403/500) since oathkeeper's
      # rs/cors-based middleware does not touch error paths.
      # The custom-http-errors=999 sentinel disables the cluster-wide
      # custom-http-errors list for THIS Ingress only — without it,
      # ingress-nginx ConfigMaps that route 4xx/5xx to a default error
      # backend strip the JSON body and CORS headers, leaving SPA
      # clients with "Failed to fetch" and no error.code visible.
      # Override `cors-allow-origin` with the actual origins; defaults
      # are derived from `global.{authDomain,appDomain}` via the
      # auth.corsAllowOrigin helper.
      annotations:
        nginx.ingress.kubernetes.io/enable-cors: "true"
        nginx.ingress.kubernetes.io/cors-allow-origin: "*"
        nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
        nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
        nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization, X-Request-ID, Cookie, X-Requested-With"
        nginx.ingress.kubernetes.io/cors-max-age: "600"
        # Route 401/403/404 to the in-chart error-page Service so the
        # browser sees a styled HTML page on the SAME host (e.g.
        # kuma.{domain}/403) instead of being redirected to
        # auth.{domain}/login for every authz error. 401 only fires
        # for requests that don't match the redirect handler's
        # text/html condition (XHR, fetch); HTML navigations still
        # get the cross-host /login redirect from Oathkeeper above.
        nginx.ingress.kubernetes.io/custom-http-errors: "401,403,404"
        # Points at the literal Service name from
        # templates/error-page/service.yaml. The oathkeeper subchart
        # ingress template renders annotations with toYaml (no tpl pass),
        # so this value cannot use {{ .Release.Name }} — the error-page
        # Service is intentionally named without a release prefix so the
        # annotation works under any release name.
        nginx.ingress.kubernetes.io/default-backend: error-page
      hosts:
        - host: auth.example.com
          paths:
            - path: /
              pathType: ImplementationSpecific
        - host: app.example.com
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls: []

  # Access rules - now served by Jinbe HTTP endpoint
  # If you still need a static ConfigMap fallback, provide inline JSON here
  # externalAccessRulesConfigMap: "my-access-rules-configmap"
  accessRules: ""

# =============================================================================
# Hydra - OAuth2 / OpenID Connect server (M2M client_credentials API keys)
# =============================================================================
# Opt-in. Disabled by default so existing consumers are unaffected. When
# enabled, Hydra issues OAuth2 clients used as scoped, per-organization API
# keys (grant_type=client_credentials). It MUST use its own database (do NOT
# share the Kratos schema). Provide DSN + secrets via your environment overlay
# (e.g. Vault), the same way Kratos is wired.
#
#   - secrets.system / DSN: inject via hydra.deployment.extraEnv referencing
#     your secret store (e.g. value: vault:secret/data/myapp#hydra-dsn).
#   - Access-token strategy: 'opaque' is recommended so deleting a client
#     revokes access on next introspection. Use 'jwt' only with short TTLs.
hydra:
  enabled: false

  # maester reconciles OAuth2Client CRDs; not needed when clients are created
  # via the Admin API by the customer-area backend. Disabled to reduce surface.
  maester:
    enabled: false

  hydra:
    automigration:
      enabled: true
    config:
      # dsn and secrets.system are intentionally empty here; supply them via
      # the environment overlay (extraEnv -> Vault) so they are never committed.
      dsn: ""
      secrets: {}
      urls:
        self:
          issuer: ""
      oauth2:
        expose_internal_errors: false
      strategies:
        access_token: opaque
      ttl:
        access_token: 15m
      log:
        level: info
        format: json

# =============================================================================
# OPAL - Policy Administration (Permit.io)
# =============================================================================
opal:
  enabled: true

  server:
    port: 7002
    policyRepoUrl: "https://github.com/w6d-io/policies.git"  # Default W6D RBAC policy
    policyRepoMainBranch: "main"
    pollingInterval: 30
    broadcastPgsql: false
    # Required only when uvicornWorkers > 1. Redis is password-protected
    # (redis.auth.enabled=true), so the broadcast URI MUST embed the password:
    #   redis://:<redis.auth.password>@<release>-redis-master:6379
    # Leaving it empty (single worker) means OPAL never connects to redis.
    broadcastUri: ""
    # Single worker → no need for inter-worker broadcast bus.
    # Increase + set broadcastUri when scaling.
    uvicornWorkers: 1
    replicas: 1
    # OPAL fetches RBAC data from Jinbe (external data source). The opal
    # subchart tpl-renders this value so {{ .Release.Name }} expands at
    # install time — no per-env override needed for the bundled topology.
    # Replace with a hard-coded URL only when pointing at an external
    # publisher.
    dataConfigSources:
      external_source_url: "http://{{ .Release.Name }}-jinbe:8080/api/admin/rbac/opal-datasource"

    # Init container that polls the data publisher (jinbe) until it serves
    # /api/admin/rbac/opal-datasource. Defends against the failure mode where
    # opal-server boots first, gets a 503, gives up, and leaves OPA with an
    # empty bindings dataset until a manual rollout restart.
    waitForDataSource:
      enabled: true
      url: ""  # Required when enabled — set per-release to the jinbe datasource URL
      image: "curlimages/curl:8.10.1"
      maxAttempts: 120  # 120 * 2s = 4 minutes total wait

  client:
    port: 7000
    opaPort: 8181
    replicas: 1
    # NOTE: Must be overridden per-release since OPAL subchart doesn't support tpl
    # Use: --set opal.client.serverUrl=http://{release}-opal-server:7002
    serverUrl: ""  # Auto-computed by OPAL subchart if empty

    # Block opal-client Ready until OPA has loaded actual RBAC bindings from
    # the publisher. Without this, the client can be Ready while OPA's
    # dataset is empty, causing silent 403s for valid super-admin users.
    requireBindings:
      enabled: true
      path: "bindings/group_membership"  # OPA path that must contain at least one '@'
      failureThreshold: 60               # 60 * 5s = 5 min before pod is killed
      periodSeconds: 5

# =============================================================================
# Jinbe - RBAC API & OPA Bundle Server
# =============================================================================
jinbe:
  enabled: true
  replicaCount: 1

  serviceAccount:
    create: true
    name: ""
    token: false
    # Annotations added to the jinbe ServiceAccount. For the S3 backup feature
    # (backup.enabled) set an IRSA role-arn here granting s3:PutObject +
    # s3:GetObject + s3:ListBucket on the bucket, e.g.:
    #   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/auth-backup-role
    annotations: {}
  # Jinbe image — REQUIRED override unless your cluster has a pull secret for
  # the W6D registry. The default below is private; a public release (e.g.
  # ghcr.io/w6d-io/jinbe:vX.Y.Z) will be wired in once published.
  # Override examples:
  #   --set jinbe.image.repository=<your-registry>/jinbe
  #   --set jinbe.image.tag=latest
  image:
    repository: ghcr.io/w6d-io/jinbe
    tag: v0.9.1
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  # Environment variables for Jinbe
  # Service URLs default to release-prefixed Kubernetes service names
  env:
    NODE_ENV: production
    APP_NAME: jinbe
    ENCRYPTION_KEY: ""  # REQUIRED - set in environment-specific values or Vault
    # REDIS_URL: auto-computed as redis://<release>-redis-master:6379
    # KRATOS_PUBLIC_URL: auto-computed as http://<release>-kratos-public:80
    # KRATOS_ADMIN_URL: auto-computed as http://<release>-kratos-admin:80
    # OPA_URL: auto-computed as http://<release>-opal-client:8181
    # OPAL_SERVER_URL: auto-computed as http://<release>-opal-server:7002
    # JINBE_INTERNAL_URL: auto-computed as http://<release>-jinbe:8080
    # OPA_DATA_URL: auto-computed as http://<release>-opal-client:8181
    # OPA_AUTHZ_REMOTE: auto-computed as http://<release>-opa-authz-proxy:<port>/v1/data/rbac/allow
    # SERVICE_DEFAULT_NAMESPACE: auto-computed as .Release.Namespace
    # SERVICE_DEFAULT_DOMAIN: auto-computed as the chart's app domain (global.appDomain or app.<global.domain>)
    # SERVICE_DEFAULT_PORT: 8080
    # CORS_ORIGIN: auto-computed from global.appDomain and global.authDomain
    # ENABLE_SWAGGER: "false"
    # LOG_LEVEL: info
    # DATABASE_URL: set if Jinbe needs a database
    # ADMIN_EMAIL: auto-created on first boot with super_admin access
    # ADMIN_PASSWORD: password for default admin (default: changeme123!)
    # ADMIN_NAME: display name for default admin
    # BACKUP_IMAGE_MONGO / BACKUP_IMAGE_POSTGRES: private-registry images
    #   for the /backups feature. Unset = backups disabled.
    # BACKUP_GCP_PROJECT_ID: GCP project ID injected into backup job env
    # REDIS_AUDIT_MAXLEN: cap for the audit event stream (Redis XADD MAXLEN ~).
    #   Default 100000. Bounds retention of the audit log (Redis-only store).
    # KRATOS_WEBHOOK_SECRET: shared secret authenticating the Kratos auth-event
    #   web_hook -> /api/webhooks/kratos. Default is a Vault reference
    #   (vault:secret/data/auth#KRATOS_WEBHOOK_SECRET); it MUST resolve to the
    #   same value as the api_key set on the Kratos after-hooks above. Provide
    #   the secret via Vault (never a literal) and rotate both sides together.

  # Additional environment variables (map format: NAME: value).
  # DISABLE_CORS=true skips Fastify's @fastify/cors plugin since the
  # ingress-nginx layer is the canonical CORS source for the stack.
  # Without this flag jinbe and ingress-nginx both emit
  # Access-Control-* headers and browsers reject the duplicate.
  extraEnv:
    DISABLE_CORS: "true"

  # Pod annotations (e.g., for Vault integration)
  podAnnotations: {}

  # Pod-level securityContext applied to BOTH the jinbe Deployment pod and the
  # bootstrap Job pod. Empty by default so nothing is assumed about the image.
  # Uncomment fields you need cluster-wide (e.g. fsGroup for a mounted volume).
  podSecurityContext: {}
    # fsGroup: 1000

  # Container-level securityContext applied to the jinbe container, the inline
  # bootstrap initContainer, and the standalone bootstrap Job container.
  # SAFE hardening defaults that do NOT assume a particular image user, so they
  # will not break boot. runAsNonRoot and readOnlyRootFilesystem are left
  # COMMENTED on purpose: the jinbe image's runtime user and its writable-path
  # requirements are unverified, and enabling either blind can crash the pod.
  # Verify against the image, then uncomment.
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
    # runAsNonRoot: true
    # readOnlyRootFilesystem: true

  resources:
    requests:
      cpu: 200m
      memory: 128Mi
    limits:
      # 1 core. 500m throttled jinbe's event loop under the gateway rule-poll +
      # admin-UI fan-out, pushing /api/health past the probe timeout. Raised so
      # health stays responsive under load.
      cpu: "1"
      memory: 512Mi

  # Health-probe tuning (consumed by jinbe/deployment.yaml). /api/health runs
  # light dependency checks and can be slow under load; a too-tight timeout was
  # SIGTERMing a busy-but-alive jinbe. Generous timeout + higher liveness
  # failureThreshold prevent restart flapping. Override per-env if needed.
  probes:
    timeoutSeconds: 5
    readiness:
      failureThreshold: 3
    liveness:
      failureThreshold: 6

  # NetworkPolicy — restrict who can reach jinbe Service. Defence in depth:
  # jinbe authenticates exclusively via Kratos session cookie now (the proxy-
  # header fallback was removed), but limiting peer connectivity prevents
  # rogue/compromised pods in the namespace from hitting admin endpoints
  # without first going through oathkeeper. Allowed peers by default:
  # oathkeeper, opal-server, opal-client, admin-ui (when enabled).
  # Set `enabled: false` if your CNI doesn't support NetworkPolicy.
  networkPolicy:
    enabled: true
    # extraIngress: list of NetworkPolicyPeer entries appended to the rule
    # (e.g. additional namespaceSelector / podSelector). Yaml-merge friendly.
    extraIngress: []

  # Bootstrap — runs `node dist/cli/bootstrap.js` as an initContainer on
  # every jinbe pod. Idempotent (Redis marker rbac:bootstrap:state); each
  # pod restart is a fast no-op once the marker exists.
  #
  # The initContainer is the canonical bootstrap path: it lets `helm install`
  # converge without a post-install hook (which would deadlock against
  # jinbe's readiness gate on the marker). Set standaloneJob: true to also
  # emit a separate Job manifest — useful when an ArgoCD pipeline wants a
  # discrete Sync-phase resource for ops visibility.
  bootstrap:
    enabled: true
    standaloneJob: false
    activeDeadlineSeconds: 600
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

# =============================================================================
# Redis - Data Store (Bitnami)
# =============================================================================
redis:
  enabled: true
  architecture: standalone
  image:
    registry: ghcr.io
    repository: w6d-io/redis
    tag: "8.2.2"
  # Password authentication (requirepass) — OPT-IN, DEFAULT OFF. Enabling it on
  # an EXISTING no-auth redis restarts the server AND requires wiring the OPAL
  # broadcaster password (see opal.server.broadcastUri); flip it per-env
  # deliberately, not as a blanket default. When enabled, every in-chart
  # consumer that connects to redis is wired to the SAME password:
  #   - jinbe: the auth.jinbe.env helper sources REDIS_PASSWORD from
  #     redis.auth.password below and embeds it in REDIS_URL, so overriding
  #     the password here alone propagates to jinbe (single source of truth).
  #   - OPAL server broadcaster: only connects to redis when
  #     opal.server.broadcastUri is set (uvicornWorkers > 1). It is empty by
  #     default so OPAL never touches redis; IF you set broadcastUri you MUST
  #     embed this password (see opal.server.broadcastUri).
  # Replace the placeholder before production, or point at an existing secret
  # via auth.existingSecret / auth.existingSecretPasswordKey. A `vault:` ref
  # does NOT work here — the bitnami redis subchart is not Vault-aware and
  # would set requirepass to the literal string.
  auth:
    enabled: false
    password: "changeme-redis-password"
  # Disable the bitnami subchart's own NetworkPolicy: its default is
  # allowExternal=true (accepts connections from any pod), and a second
  # co-located NetworkPolicy would be additive (union), so it could not
  # restrict anything. The parent chart ships a restrictive, release-pinned
  # NetworkPolicy instead (templates/redis/networkpolicy.yaml, gated by
  # redisNetworkPolicy.enabled) that allows only jinbe + OPAL pods.
  networkPolicy:
    enabled: false
  master:
    persistence:
      size: 1Gi

# Redis NetworkPolicy (parent-chart, defense-in-depth). Restricts ingress to
# the bundled redis to jinbe + OPAL server/client pods on the redis port. Kept
# OUT of the redis.* block so it does not collide with the bitnami subchart's
# networkPolicy schema. Set enabled=false if your CNI doesn't support
# NetworkPolicy. Only rendered when redis.enabled.
redisNetworkPolicy:
  enabled: true
  # extraIngress: additional NetworkPolicyPeer entries appended to the rule.
  extraIngress: []

# =============================================================================
# OPA AuthZ Proxy - Translates OPA decisions into HTTP status codes
# =============================================================================
opaAuthzProxy:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/w6d-io/infra/opa-authz-proxy
    # v0.4.0 forwards X-Tenant-Id into the OPA input and emits an
    # X-User-Organizations response header — DORMANT until a caller sends
    # X-Tenant-Id (none do yet). Retains v0.3.1 behaviour: HTTP 403 on deny
    # (oathkeeper's remote_json authorizer rejects any other status), and the
    # rego's decision.reason rides along as an `X-Authz-Reason` header for
    # upstreams that want to distinguish a route_map miss from a denial.
    tag: "v0.4.0"
    pullPolicy: IfNotPresent

  # Auto-computed from opal client service if empty
  opaUpstreamUrl: ""

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi

# =============================================================================
# Kratos Login UI
# =============================================================================
kratosLoginUi:
  # Public image at ghcr.io/w6d-io/kratos-login-ui:v0.2.0. Enabled by
  # default — the Oathkeeper rule `selfservice-ui` upstream points at
  # this Service, so auth/registration UI flows require it running.
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/w6d-io/kratos-login-ui
    pullPolicy: IfNotPresent
    tag: "v0.2.0"

  branding:
    appName: "My App"
    logoUrl: "/logo.svg"
    faviconUrl: "/favicon.ico"

  theme:
    primaryColor: "3B82F6"
    darkMode: true
    backgroundColor: "111827"

  kratos:
    browserUrl: "https://auth.example.com"
    publicUrl: ""  # Auto: http://<release>-kratos-public:80

  redirects:
    defaultReturnUrl: "https://app.example.com"
    allowedReturnUrls: "https://*.example.com"

  texts:
    loginTitle: "Welcome back"
    loginSubtitle: "Sign in to your account"
    registerTitle: "Create account"
    registerSubtitle: "Get started with your account"
    recoveryTitle: "Reset password"
    recoverySubtitle: "Enter your email to reset your password"

  footer:
    text: ""
    links: []

  service:
    type: ClusterIP
    port: 80
    targetPort: 3000

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5

  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# =============================================================================
# PostgreSQL Simple - Lightweight Postgres (official image, no Bitnami)
# =============================================================================
# Use this when Bitnami images can't be pulled. Mutually exclusive with postgresql.
postgresqlSimple:
  enabled: true  # Set to false if using Bitnami postgresql or external DB
  image:
    repository: postgres
    tag: "16"
  auth:
    username: kratos
    password: kratos
    database: kratos
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# =============================================================================
# Error Page — inline 401/403/404 backend
# =============================================================================
# Tiny nginx Service that ingress-nginx points custom-http-errors at.
# Renders the same-host error pages so a forbidden request to
# kuma.{domain}/x returns HTML on kuma.{domain} instead of redirecting
# to auth.{domain}/login. Style is overridable via .branding.
errorPage:
  enabled: true
  replicaCount: 1
  image:
    repository: nginx
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  branding:
    appName: ""           # defaults to global.domain
    primaryColor: "#3B82F6"
    backgroundColor: "#111827"
    textColor: "#F9FAFB"
    homeUrl: ""           # defaults to https://{appDomain}
    supportEmail: ""
  resources:
    requests:
      cpu: 5m
      memory: 8Mi
    limits:
      cpu: 50m
      memory: 32Mi

# =============================================================================
# Admin UI (Kuma) - RBAC Management Dashboard
# =============================================================================
adminUi:
  # Public image at ghcr.io/w6d-io/kuma. Enabled by default so a fresh
  # install gets the RBAC dashboard out of the box; disable if you ship
  # your own admin UI.
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/w6d-io/kuma
    tag: v2.10.0
    pullPolicy: IfNotPresent
  env:
    # API_BASE → the SPA's API origin. Empty = same-origin (kuma is served
    # behind the same host/ingress as the API). Set to https://app.{domain}
    # only for a split-origin deployment.
    API_BASE: ""
    # AUTH_DOMAIN → substituted into kuma's index.html at container start
    # (envsubst → window.__AUTH_DOMAIN__); drives the 401 redirect target.
    # Empty auto-derives from global.authDomain (or auth.<global.domain>).
    AUTH_DOMAIN: ""
  extraEnv: {}
  podAnnotations: {}
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ─── Scheduled Backup + in-app restore ──────────────────────────────────────────
# When enabled, JINBE ITSELF exports the RBAC bundle on `schedule` and uploads it
# to s3://<bucket>/<prefix>/{timestamp}.json + a rolling latest.json (no external
# CronJob — jinbe is self-authenticated and holds the S3 creds). jinbe also reads
# the bucket so the kuma Backup tab can list snapshots + one-click restore, and a
# fresh install auto-restores from latest.json before seeding defaults.
#
# IAM (IRSA): annotate jinbe.serviceAccount.annotations with a role-arn granting
# s3:PutObject + s3:GetObject + s3:ListBucket on the bucket, e.g.:
#   jinbe:
#     serviceAccount:
#       annotations:
#         eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/auth-backup-role
backup:
  enabled: false
  schedule: "0 2 * * *"        # Daily at 02:00 UTC (jinbe-run, cron in UTC)
  s3:
    bucket: ""                  # Required when enabled=true
    prefix: "auth-backup"
    region: "eu-west-3"
