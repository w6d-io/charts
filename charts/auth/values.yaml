# =============================================================================
# Auth Stack - Complete Authentication & Authorization Helm Chart
# =============================================================================

# =============================================================================
# Global Configuration
# =============================================================================
global:
  # Base domain - all URLs are derived from this
  domain: example.com
  # Override if auth domain differs from auth.<domain>
  # authDomain: auth.example.com
  # Override if app domain differs from app.<domain>
  # appDomain: app.example.com
  imagePullSecrets: []

  # Vault configuration (Banzai Cloud) - annotations auto-injected when enabled
  vault:
    enabled: false
    address: http://vault.vault:8200
    role: ""
    envFromPath: ""
  audit:
    webhook:
      secret: vault:secret/data/auth#KRATOS_WEBHOOK_SECRET
      url: http://{{ .Release.Name }}-jinbe:8080/api/webhooks/kratos


nameOverride: ""
fullnameOverride: ""

# =============================================================================
# Kratos - Identity Management (Ory)
# =============================================================================
kratos:
  enabled: true

  # ServiceAccount is created by auth chart (templates/kratos/serviceaccount.yaml)
  # with automountServiceAccountToken: true for Vault integration
  deployment:
    serviceAccount:
      create: false  # Disabled - SA created by parent chart with automount enabled
      name: kratos
      annotations: {}
    automountServiceAccountToken: true
    # extraEnv is tpl-rendered by the kratos subchart, so {{ .Release.Name }}
    # resolves to the actual release at install time. Used here to wire the
    # DSN against the bundled postgres Service ({release}-postgresql) without
    # forcing every consumer to copy/paste the DSN into a per-env overlay.
    # Override the entire entry (or set kratos.kratos.config.dsn) if you point
    # Kratos at an external database.
    extraEnv:
      - name: DSN
        value: "postgresql://kratos:kratos@{{ .Release.Name }}-postgresql:5432/kratos?sslmode=disable"
    # Secret rendered by this chart (templates/kratos/webhook-env-secret.yaml) and loaded with envFrom
    # into Kratos and its automigrate init container. It carries one Kratos config override per
    # web_hook whose auth value is a Vault reference, e.g.
    #   SELFSERVICE_FLOWS_LOGIN_AFTER_HOOKS_0_CONFIG_AUTH_CONFIG_VALUE=vault:secret/data/auth#KRATOS_WEBHOOK_SECRET
    # because vault-env substitutes env vars, not the kratos.yaml ConfigMap. References only, never a
    # secret value. Generated from the final kratos.config hooks, so env overlays need no change.
    # Empty disables it (then a Vault reference in a hook is sent verbatim and jinbe answers 401).
    environmentSecretsName: auth-kratos-webhook-env
    # Admin token sidecar (kratos.adminAuth below, templates/_admin-auth.tpl). Renders nothing
    # while kratos.adminAuth.enabled is false.
    extraContainers: |
      {{- include "auth.adminAuth.sidecar" (dict "root" . "port" .Values.kratos.config.serve.admin.port "key" "KRATOS_ADMIN_TOKEN") }}
    # Probes on the PUBLIC port: the admin port is behind the token sidecar once adminAuth is on (its
    # health paths stay open, but a probe there would restart Kratos whenever the sidecar is down).
    # Same checks as the chart defaults (/health/alive and /health/ready exist on both ports).
    customReadinessProbe:
      httpGet:
        path: /health/alive
        port: http-public
        httpHeaders:
          - name: Host
            value: "127.0.0.1"
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 5
    customStartupProbe:
      httpGet:
        path: /health/ready
        port: http-public
        httpHeaders:
          - name: Host
            value: "127.0.0.1"
      failureThreshold: 5
      successThreshold: 1
      periodSeconds: 1
      timeoutSeconds: 2
      initialDelaySeconds: 1

  # The courier StatefulSet falls back to deployment.extraContainers when this is empty; it serves no
  # admin API, so it gets a template that renders nothing instead of the sidecar.
  statefulSet:
    extraContainers: '{{- /* no admin-auth sidecar in the courier */ -}}'

  # Token-checking sidecar in front of the Kratos admin API (P0: NetworkPolicy is not enforced, so
  # every pod reaches it). Enabled: serve.admin.host becomes 127.0.0.1 and an nginx sidecar on the pod
  # IP, same port, lets through only `Authorization: Bearer <KRATOS_ADMIN_TOKEN>` (health and metrics
  # paths open). Every admin caller must send it first: jinbe >= the admin-auth build with
  # KRATOS_ADMIN_TOKEN in jinbe.extraEnv. Token: `token` (a literal or a vault: reference vault-env
  # resolves in this Vault-annotated pod) or else Secret `secretName` / `secretKey`
  # (adminAuthSecret renders one from Vault).
  adminAuth:
    enabled: false
    token: ""
    secretName: ""        # default <release>-admin-tokens
    secretKey: KRATOS_ADMIN_TOKEN
    image: nginxinc/nginx-unprivileged:1.27-alpine
    resources: {}         # default requests 5m/8Mi, limit 32Mi

  ingress:
    public:
      enabled: false  # Traffic routed through Oathkeeper

  kratos:
    automountServiceAccountToken: true
    config:
      # ─── Database (DSN) ───────────────────────────────────────────────────
      # The chart bundles a simple postgresql StatefulSet (postgresqlSimple)
      # whose Service is `<release>-postgresql:5432`. The default DSN below
      # assumes you install with `helm install auth ./auth`, producing service
      # `auth-postgresql`. Override `kratos.kratos.config.dsn` if your release
      # name differs OR you point at an external DB.
      #
      # Plug-and-play options:
      #   - Bundled simple postgres (default):
      #       dsn: postgresql://kratos:kratos@auth-postgresql:5432/kratos?sslmode=disable
      #
      #   - SQLite (single-instance, dev or low-traffic; data persists in PVC):
      #       dsn: sqlite:///var/lib/kratos/kratos.sqlite?_fk=true&mode=rwc
      #     (also disable postgresqlSimple, mount a PVC at /var/lib/kratos
      #      via kratos.deployment.extraVolumes/extraVolumeMounts)
      #     Reference: https://www.ory.sh/docs/hydra/self-hosted/dependencies-environment#sqlite
      #
      #   - External Postgres / RDS / Cloud SQL:
      #       dsn: postgresql://USER:PASS@HOST:5432/DB?sslmode=require
      #
      #   - In-memory (state lost on pod restart — testing only):
      #       dsn: memory
      #
      # Leave empty here and feed DSN via deployment.extraEnv below so the
      # release name (which the bundled postgres Service is prefixed with)
      # is interpolated at install time — keeps the default plug-and-play
      # regardless of `helm install <whatever> ...`.
      dsn: ""

      # ─── Cryptographic secrets ────────────────────────────────────────────
      # Ory schema constraints:
      #   default[*]  — min 16 chars
      #   cookie[*]   — min 16 chars (used to sign session cookies)
      #   cipher[*]   — exactly 32 chars (XChaCha20-Poly1305 key)
      # PROD: rotate via vault and pass via Vault sidecar / external secrets.
      # Examples below are deterministic placeholders, NOT for production use.
      secrets:
        default:
          - changeme-default-secret-16chars
        cookie:
          - changeme-cookie-secret-16chars0
        cipher:
          - changeme-this-cipher-secret-32cc
      identity:
        default_schema_id: default
        schemas:
          - id: default
            url: file:///etc/config/person.schema.json
      serve:
        admin:
          # 127.0.0.1 while kratos.adminAuth fronts the admin port, else "" (all interfaces).
          host: '{{ include "auth.adminAuth.bindHost" . }}'
        public:
          base_url: https://auth.example.com/
          cors:
            enabled: true
            allowed_origins:
              - https://auth.example.com
              - https://app.example.com
      # Account enumeration: Kratos stops telling "no such account" apart where it can (the
      # identifier-first step renders every method; no fast code send that would reveal the account).
      # Kratos v26.2 still answers a code sign-in for an unknown address with "account does not exist":
      # jinbe's sign-in gate (jinbe.signInGate) makes every such submit cost a solved bot check and
      # counts it against the per-IP code limit.
      security:
        account_enumeration:
          mitigate: true
      session:
        # Session extender: jinbe's whoami calls PATCH /admin/sessions/{id}/extend
        # (best-effort). earliest_possible_extend MUST be < lifespan so active users
        # keep a sliding session with minimal Set-Cookie churn.
        lifespan: 24h
        earliest_possible_extend: 1h
        cookie:
          domain: example.com
          same_site: Lax
          persistent: true
        # Keep AAL1 sessions valid for cross-subdomain whoami checks.
        # Kratos >=0.11 defaults to highest_available, which forces every
        # session check to demand AAL2 as soon as the user enrols TOTP
        # or WebAuthn — breaking SSO across tenant subdomains. Step-up
        # still happens on privileged self-service flows (settings) via
        # privileged_session_max_age below.
        # KC-1: override per env to try `highest_available` (sandbox first).
        whoami:
          required_aal: aal1
      selfservice:
        # Wildcard covers every tenant subdomain of {domain}. Kratos
        # globs are supported since v0.10, and kratos-login-ui's
        # regex-translated matcher accepts the same pattern.
        allowed_return_urls:
          - https://*.example.com
          - http://*.example.com
        # Where Kratos sends a browser that has no return_to — including signed-in users it
        # answers directly (e.g. /self-service/registration/browser with a session), bypassing
        # login-ui. login-ui's /welcome then lands them on the requested page, their site or
        # the site picker. Keep it on the auth host, never an app host.
        default_browser_return_url: https://auth.example.com/welcome
        methods:
          password:
            enabled: true
          oidc:
            enabled: false
            config:
              providers: []
          # Clickable link for recovery and the "send me a sign-in link" flow (SUP-4). The
          # code method stays on (Kratos default) for verification and passwordless code.
          link:
            enabled: true
          # KC-3: passwordless code sign-in ("email me a code") lets anyone probe which
          # emails have an account. It is OFF by default in Kratos (and here); envs that set
          # `passwordless_enabled: true` turn it on — set false to close that enumeration.
          # code:
          #   passwordless_enabled: false
        flows:
          error:
            ui_url: https://auth.example.com/auth/error
          settings:
            ui_url: https://auth.example.com/auth/settings
            privileged_session_max_age: 15m
            # ── Audit webhook (auth events → jinbe) ────────────────────────────
            # After each settings change Kratos POSTs a compact auth event to the
            # jinbe audit sink. Per-method hooks (password / profile / totp /
            # webauthn / lookup_secret) each stamp the correct `method`; MFA
            # enrol/remove is captured via the totp/webauthn/lookup_secret
            # entries. Per-method (not the global `after.hooks`) is used on
            # purpose so each event carries its method AND so an update never
            # fires the hook twice. The `body` is a base64:// Jsonnet template —
            # function(ctx){...} — emitting ONLY
            # {flow,identity_id,identity_email,method,ip,ua}: no secrets, no
            # traits blob. `response.ignore: true` makes the call fire-and-forget
            # so a slow or down jinbe can never block the user's flow. The
            # api_key `value` is a Vault reference (never a literal secret) and
            # MUST resolve to the same value as jinbe's KRATOS_WEBHOOK_SECRET env.
            # url / method / response / auth are YAML-anchored here and reused by
            # the login and registration hooks below (Helm expands the anchors).
            after:
              password:
                hooks:
                  - hook: web_hook
                    config:
                      url: '{{ tpl .Values.global.audit.webhook.url . }}'
                      method: &auditWebhookMethod POST
                      body: 'base64:'
                      response: &auditWebhookResponse
                        ignore: true
                      auth:
                        type: api_key
                        config:
                          name: X-Kratos-Webhook-Secret
                          in: header
                          value: '{{ .Values.global.audit.webhook.secret }}'
              # Protected traits (auth-guard): a profile save first passes jinbe's guard, which
              # refuses any change to a protected trait (response.parse → field message), then
              # the audit hook. Needs jinbe >= 5297b87 (rollout order: see registration below).
              # Off: examples/kratos-guard-settings-off-values.yaml.
              profile:
                hooks:
                  - hook: web_hook
                    config:
                      url: 'http://{{ .Release.Name }}-jinbe:8080/api/webhooks/kratos/guard'
                      method: POST
                      body: 'base64:'
                      response:
                        parse: true
                      auth:
                        type: api_key
                        config:
                          name: X-Kratos-Webhook-Secret
                          in: header
                          value: '{{ .Values.global.audit.webhook.secret }}'
                  - hook: web_hook
                    config:
                      url: '{{ tpl .Values.global.audit.webhook.url . }}'
                      method: *auditWebhookMethod
                      body: 'base64:'
                      response: *auditWebhookResponse
                      auth:
                        type: api_key
                        config:
                          name: X-Kratos-Webhook-Secret
                          in: header
                          value: '{{ .Values.global.audit.webhook.secret }}'
              totp:
                hooks:
                  - hook: web_hook
                    config:
                      url: '{{ tpl .Values.global.audit.webhook.url . }}'
                      method: *auditWebhookMethod
                      body: 'base64:'
                      response: *auditWebhookResponse
                      auth:
                        type: api_key
                        config:
                          name: X-Kratos-Webhook-Secret
                          in: header
                          value: '{{ .Values.global.audit.webhook.secret }}'
              webauthn:
                hooks:
                  - hook: web_hook
                    config:
                      url: '{{ tpl .Values.global.audit.webhook.url . }}'
                      method: *auditWebhookMethod
                      body: 'base64:'
                      response: *auditWebhookResponse
                      auth:
                        type: api_key
                        config:
                          name: X-Kratos-Webhook-Secret
                          in: header
                          value: '{{ .Values.global.audit.webhook.secret }}'
              lookup_secret:
                hooks:
                  - hook: web_hook
                    config:
                      url: '{{ tpl .Values.global.audit.webhook.url . }}'
                      method: *auditWebhookMethod
                      body: 'base64:'
                      response: *auditWebhookResponse
                      auth:
                        type: api_key
                        config:
                          name: X-Kratos-Webhook-Secret
                          in: header
                          value: '{{ .Values.global.audit.webhook.secret }}'
          recovery:
            enabled: true
            use: link
            # Audit webhook — emit an auth event to jinbe after each successful recovery
            # (a recovery sign-in, e.g. kuma's "Send sign-in link": its session skips login.after). Same url/method/response/auth as the other audit hooks; method = the
            # flow's active method (link/code).
            after:
              hooks:
                - hook: web_hook
                  config:
                    url: '{{ tpl .Values.global.audit.webhook.url . }}'
                    method: *auditWebhookMethod
                    body: 'base64:'
                    response: *auditWebhookResponse
                    auth:
                      type: api_key
                      config:
                        name: X-Kratos-Webhook-Secret
                        in: header
                        value: '{{ .Values.global.audit.webhook.secret }}'
          verification:
            enabled: true
            # link, not code: jinbe mails verification links outside any flow the user holds
            # (resend verification, admin email change); a mailed code would be unusable.
            use: link
            # Audit webhook — emit an auth event to jinbe after each successful verification
            # (an address verified). Same url/method/response/auth as the other audit hooks; method = the
            # flow's active method (link/code).
            after:
              hooks:
                - hook: web_hook
                  config:
                    url: '{{ tpl .Values.global.audit.webhook.url . }}'
                    method: *auditWebhookMethod
                    body: 'base64:'
                    response: *auditWebhookResponse
                    auth:
                      type: api_key
                      config:
                        name: X-Kratos-Webhook-Secret
                        in: header
                        value: '{{ .Values.global.audit.webhook.secret }}'
          logout:
            after:
              # login-ui serves sign-in at /login (root, as every env sets it)
              default_browser_return_url: https://auth.example.com/login
          login:
            ui_url: https://auth.example.com/auth/login
            lifespan: 10m
            # Audit webhook — emit an auth event to jinbe after every successful
            # login (any method). Reuses the anchored url/method/response/auth
            # defined in the settings flow above; see that block for the payload
            # shape and security notes.
            after:
              hooks:
                - hook: web_hook
                  config:
                    url: '{{ tpl .Values.global.audit.webhook.url . }}'
                    method: *auditWebhookMethod
                    body: 'base64:'
                    response: *auditWebhookResponse
                    auth:
                      type: api_key
                      config:
                        name: X-Kratos-Webhook-Secret
                        in: header
                        value: '{{ .Values.global.audit.webhook.secret }}'
          registration:
            lifespan: 10m
            # KC-2: kratos-login-ui serves sign-up at /register (root, as every env sets it)
            ui_url: https://auth.example.com/register
            # Audit webhook — emit an auth event to jinbe after each successful
            # registration. Reuses the anchored url/method/response/auth from the
            # settings flow above.
            #
            # Sign-in protection (auth-guard): every sign-up method (password, code, oidc,
            # webauthn, passkey) first passes jinbe's guard (POST /api/webhooks/kratos/guard,
            # response.parse → jinbe may refuse with field messages: bot check, sign-up mode,
            # allowed/disposable domains, protected traits), then the audit hook. A per-method
            # list REPLACES the global `hooks` for that method, so each carries its own audit
            # copy; a list for a method that is off is inert. The guard body sends the traits:
            # jinbe >= 5297b87 REFUSES a registration body without them (protected traits).
            # Envs that set their own after.<method>.hooks (e.g. `code: [session]`) must repeat
            # guard + audit there, session LAST. To run without the guard, override the lists
            # with the audit hook only (examples/kratos-guard-registration-off-values.yaml).
            #
            # ROLLOUT ORDER (protected traits): 1) these guard bodies with traits, 2) jinbe
            # >= 5297b87, 3) the settings profile guard (an older jinbe answers flow:settings
            # with 400, which would block every profile save).
            after:
              password:
                hooks:
                  - &kratosGuardRegistration
                    hook: web_hook
                    config:
                      url: 'http://{{ .Release.Name }}-jinbe:8080/api/webhooks/kratos/guard'
                      method: POST
                      body: 'base64:'
                      response:
                        parse: true
                      auth: &kratosWebhookAuth
                        type: api_key
                        config:
                          name: X-Kratos-Webhook-Secret
                          in: header
                          value: '{{ .Values.global.audit.webhook.secret }}'
                  - &kratosRegistrationAudit
                    hook: web_hook
                    config:
                      url: '{{ tpl .Values.global.audit.webhook.url . }}'
                      method: *auditWebhookMethod
                      body: 'base64:'
                      response: *auditWebhookResponse
                      auth: *kratosWebhookAuth
              code:
                hooks:
                  - *kratosGuardRegistration
                  - hook: web_hook
                    config:
                      url: '{{ tpl .Values.global.audit.webhook.url . }}'
                      method: *auditWebhookMethod
                      body: 'base64:'
                      response: *auditWebhookResponse
                      auth: *kratosWebhookAuth
              oidc:
                hooks:
                  - *kratosGuardRegistration
                  - hook: web_hook
                    config:
                      url: '{{ tpl .Values.global.audit.webhook.url . }}'
                      method: *auditWebhookMethod
                      body: 'base64:'
                      response: *auditWebhookResponse
                      auth: *kratosWebhookAuth
              webauthn:
                hooks:
                  - *kratosGuardRegistration
                  - hook: web_hook
                    config:
                      url: '{{ tpl .Values.global.audit.webhook.url . }}'
                      method: *auditWebhookMethod
                      body: 'base64:'
                      response: *auditWebhookResponse
                      auth: *kratosWebhookAuth
              passkey:
                hooks:
                  - *kratosGuardRegistration
                  - hook: web_hook
                    config:
                      url: '{{ tpl .Values.global.audit.webhook.url . }}'
                      method: *auditWebhookMethod
                      body: 'base64:'
                      response: *auditWebhookResponse
                      auth: *kratosWebhookAuth
              hooks:
                - hook: web_hook
                  config:
                    url: '{{ tpl .Values.global.audit.webhook.url . }}'
                    method: *auditWebhookMethod
                    body: 'base64:'
                    response: *auditWebhookResponse
                    auth:
                      type: api_key
                      config:
                        name: X-Kratos-Webhook-Secret
                        in: header
                        value: '{{ .Values.global.audit.webhook.secret }}'
      # Request headers Kratos forwards to web hooks. Setting it REPLACES Kratos' default list,
      # so this is that default + X-Forwarded-For (the guard's and the audit hook's client ip;
      # without it the audit ip was always null).
      clients:
        web_hook:
          header_allowlist:
            - Accept
            - Accept-Encoding
            - Accept-Language
            - Content-Length
            - Content-Type
            - Origin
            - Priority
            - Referer
            - Sec-Ch-Ua
            - Sec-Ch-Ua-Mobile
            - Sec-Ch-Ua-Platform
            - Sec-Fetch-Dest
            - Sec-Fetch-Mode
            - Sec-Fetch-Site
            - Sec-Fetch-User
            - True-Client-Ip
            - User-Agent
            - X-Forwarded-For
      log:
        level: info
        format: json
        leak_sensitive_values: false
      # Native OpenTelemetry (OBS-2.2). Off until `provider: otel` is set; OTLP/HTTP host:port.
      tracing:
        service_name: kratos
        providers:
          otlp:
            server_url: otel-collector.otel:4318
            insecure: true
            sampling:
              sampling_ratio: 1.0
      ciphers:
        algorithm: xchacha20-poly1305
      hashers:
        argon2:
          parallelism: 1
          memory: 128MB
          iterations: 2
          salt_length: 16
          key_length: 16
    # ─── Database migration ───────────────────────────────────────────────
    # initContainer runs migration inside the Kratos pod before the main
    # container starts, so it waits for Postgres readiness through normal
    # Pod lifecycle. The alternative (`type: job`) creates a Helm pre-install
    # hook that runs BEFORE chart resources, deadlocking fresh installs that
    # bundle their own postgres (hook waits for DB, DB hasn't been deployed
    # yet). InitContainer is idempotent and safe for already-migrated DBs.
    automigration:
      enabled: true
      type: initContainer

    # Example identity schemas - customize for your use case.
    # The default schema declares the email trait as the identifier for
    # password, totp account_name, and webauthn — all three are required
    # for those flows to attach correctly. Without `totp.account_name`
    # the QR/secret would have no human-readable label; without
    # `webauthn.identifier` registering a security key fails.
    identitySchemas:
      person.schema.json: |
        {
          "$id": "https://schemas.example.com/person.schema.json",
          "$schema": "http://json-schema.org/draft-07/schema#",
          "title": "Person",
          "type": "object",
          "properties": {
            "traits": {
              "type": "object",
              "properties": {
                "email": {
                  "type": "string",
                  "format": "email",
                  "title": "Email",
                  "ory.sh/kratos": {
                    "credentials": {
                      "password": { "identifier": true },
                      "totp": { "account_name": true },
                      "webauthn": { "identifier": true }
                    },
                    "verification": { "via": "email" },
                    "recovery": { "via": "email" }
                  }
                },
                "name": { "type": "string", "title": "Name" }
              },
              "required": ["email"],
              "additionalProperties": false
            }
          }
        }

# =============================================================================
# authEmail - branded Kratos courier code emails (recovery + verification)
# =============================================================================
# Renders templates/kratos/email-templates.yaml into per-type ConfigMaps that
# Kratos mounts as courier template overrides. Disabled by default: leaving this
# off means Kratos uses its built-in default emails (safe, no ConfigMaps).
#
# To ENABLE in a values overlay you must set THREE things together (kept in the
# overlay, not here, so the chart is inert by default):
#   1. authEmail.enabled: true (+ bannerUrl / brandName / subject below)
#   2. kratos.kratos.config.courier.template_override_path: /conf/courier-templates
#   3. kratos.statefulSet.extraVolumes + extraVolumeMounts mounting each
#      ConfigMap ({release}-email-recovery-code-valid / -verification-code-valid)
#      at /conf/courier-templates/<recovery_code|verification_code>/valid
authEmail:
  # Renders branded Kratos courier templates as ConfigMaps for all seven flows:
  # login/registration/recovery/verification code-valid emails, the recovery /
  # verification "invalid" notices, and the verifiable-address-changed alert.
  # Mount them via kratos.statefulSet/deployment extraVolumes+extraVolumeMounts
  # under courier.template_override_path. Disabled -> Kratos built-in defaults.
  enabled: false
  # Public https URL of the banner image. Must be reachable by the recipient's
  # mail client (email clients block data: URIs). Empty -> a text brand header
  # is used instead of an <img>.
  bannerUrl: ""
  # Brand name for the <img alt> / text-header fallback and body copy
  # (replaces the BRAND_NAME token in the bodies).
  brandName: ""
  # Support contact email shown in the body/footer (replaces SUPPORT_EMAIL).
  supportEmail: ""
  # Optional single subject applied to every flow. Leave empty to use the
  # per-flow subjects (e.g. "Votre code de connexion <brandName>", the
  # address-changed alert has its own subject, etc.).
  subject: ""

# =============================================================================
# Oathkeeper - API Gateway (Ory)
# =============================================================================
# helmTemplatedConfigEnabled allows {{ .Release.Name }} in oathkeeper.config.
# The tpl runs in the SUBCHART context, so only .Release.Name/.Namespace are
# available -- parent-chart includes and .Values are NOT accessible.
# Oathkeeper's own Go template syntax ({{ .Subject }}, etc.) is escaped with
# {{ "{{" }} ... {{ "}}" }} to survive the tpl pass.
oathkeeper:
  enabled: true

  # rules-sync sidecar — hot-reload Oathkeeper access rules with NO restart / NO GitOps.
  # A blocking init does the first fetch of jinbe's rules into a shared emptyDir file
  # (/etc/rules/access-rules.json); a sidecar then polls jinbe and atomically replaces
  # that file only when it changes. Oathkeeper reads file:///etc/rules/access-rules.json
  # + fsnotify and reloads in place. The init/sidecar specs live under
  # oathkeeper.deployment.extra* below (tpl-rendered by the subchart).
  rulesSync:
    enabled: true
    url: ""                       # empty -> http://<release>-jinbe:8080/api/oathkeeper/rules
    intervalSeconds: 5
    initRetries: 30
    image: "curlimages/curl:8.11.1"

  # Platform hosts on a Gateway API Gateway (templates/oathkeeper/route.yaml), the twin of
  # ingress.proxy: hosts default to ingress.proxy.hosts[].host; cors is an HTTPRoute CORS filter
  # (allowOrigins, allowMethods, allowHeaders, exposeHeaders, allowCredentials, maxAge).
  edge:
    httpRoute:
      enabled: false
      parentRefs: []
      hosts: []
      cors: {}
      requestTimeout: ""    # e.g. 300s (long polls, SSE)

  # Send the Hydra admin token on token introspection (needed once hydra.adminAuth is on).
  #  - tokenRef: a vault: reference resolved by vault-env in the Oathkeeper pod (no Secret). Needs
  #    deployment.podMetadata.annotations with the Bank-Vaults role annotations, a ServiceAccount
  #    bound to that role (deployment.serviceAccount / oathkeeper.serviceAccount) and
  #    deployment.automountServiceAccountToken: true.
  #  - else Secret secretName (default <release>-admin-tokens) / secretKey, rendered by
  #    adminAuthSecret (environments where the secrets webhook can resolve it).
  adminAuth:
    enabled: false
    tokenRef: ""          # e.g. vault:infra/data/<env>#HYDRA_ADMIN_TOKEN
    secretName: ""
    secretKey: HYDRA_ADMIN_TOKEN

  # Where Oathkeeper reads its access rules from (Sites cut-over, docs/SERVICE_PLUG.md):
  #   legacy  — rules-sync file only (/etc/rules/access-rules.json). Default; unchanged behaviour.
  #   maester — oathkeeper-maester in sidecar mode (native sidecar, API watch of Rule CRs in this
  #             namespace) writes /etc/rules/access-rules.json; rules-sync is not run.
  #   dual    — both run; maester writes /etc/rules/maester.json next to rules-sync's
  #             access-rules.json (one writer per file) and Oathkeeper loads BOTH, so legacy
  #             routes and Site rules are enforced side by side. A request matched by a rule
  #             in each file is a 500 (no priority): Sites must not cover legacy routes (the
  #             operator's overlap check / gatekit parity), and a route moves by being removed
  #             from one side as it lands on the other.
  # A user-supplied oathkeeper.oathkeeper.config.access_rules.repositories overrides all of this.
  rules:
    source: legacy
    # Ship the maester Rule CRD (rules.oathkeeper.ory.sh) when source != legacy or
    # siteOperator.enabled. Set false where another release already owns it.
    installCRD: true
    # Platform Rule CRs shipped with source maester|dual. Oathkeeper with 0 rules is NotReady,
    # so at least `ready` (GET <authDomain>/.oathkeeper/ready → error-page, anonymous) always
    # ships. Extra entries are maester Rule specs keyed by name, e.g.
    #   kuma: {match: {url: "<https?>://kuma.example.com/<.*>", methods: [GET]}, upstream: {url: ...},
    #          authenticators: [{handler: cookie_session}], authorizer: {handler: remote_json}}
    platformRules: {}
    # Anonymous GET <authDomain>/api/public/sites/<.*> → jinbe (by-host branding, :name/logo,
    # :name/access-reason). On the AUTH host on purpose: no built-in rule covers /api/ there
    # (gatekit: 0 overlaps vs jinbe's built-in rules), while app/api hosts have catch-all
    # jinbe rules. Oathkeeper forwards the Cookie header, so access-reason can read the session
    # inside jinbe. Legacy: an extra inline:// repository next to the rules-sync file;
    # maester/dual: platform Rule `platform-public-sites` (dual loads maester.json too, so
    # never both). noop is used because `anonymous` is
    # not enabled globally (enable it first to switch). Off by default (new public route).
    publicSites:
      enabled: false
      authenticator: noop
      # empty: http://<release>-jinbe.<namespace>.svc.cluster.local:8080
      upstream: ""

  # oathkeeper-maester sidecar (rules.source maester|dual). Runs as a native sidecar
  # (initContainer, restartPolicy Always) so it starts before Oathkeeper and keeps running.
  # Upstream v0.1.14 writes the file non-atomically (0-rule 404 blips on every change) and
  # can keep a deleted Rule on one of N pods: use the patched build
  # (site-operator hack/maester-sidecar.patch, e.g. v0.1.14-w6d.1) until it is upstreamed.
  # Oathkeeper with 0 rules is NotReady: rules.source=maester needs at least one platform Rule.
  # PLACEHOLDER IMAGE — must be built: upstream v0.1.14 writes the rules file non-atomically
  # (0-rule 404 blips on every change) and can keep a deleted Rule live on one of N pods.
  # Build v0.1.14 + ~/.ghq/github.com/auth/site-operator/hack/maester-sidecar.patch and push it
  # under this name (or override per env) until the fix is upstreamed.
  maesterSidecar:
    image: "ghcr.io/w6d-io/oathkeeper-maester:v0.1.14-w6d.1"
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits:   { memory: 128Mi }

  # Graceful rollout: every Gateway change (and every config change) rolls Oathkeeper; a
  # single-replica swap dropped requests with 502 on the sandbox. Two replicas, surge-only
  # rolling update, a PDB, and a preStop pause so ingress-nginx stops sending to a pod before
  # it gets SIGTERM. Oathkeeper then waits at most 5 s (ory/graceful default, not
  # configurable) for open requests; longer streams (kuma SSE) are cut and reconnect.
  # terminationGracePeriodSeconds must stay above preStop + 5 s.
  replicaCount: 2
  pdb:
    enabled: true
    spec:
      maxUnavailable: 1

  deployment:
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    # native sleep action (k8s >= 1.30): the image needs no shell
    lifecycle:
      preStop:
        sleep:
          seconds: 10
    terminationGracePeriodSeconds: 30
    # oauth2_introspection -> Hydra admin with the Hydra admin token (oathkeeper.adminAuth below).
    # Disabled: the Secret is optional and the header override is `{}`, Oathkeeper's default.
    extraEnv:
      - name: HYDRA_ADMIN_TOKEN
        valueFrom:
          secretKeyRef:
            name: '{{ include "auth.adminAuth.secretName" . }}'
            key: '{{ .Values.adminAuth.secretKey | default "HYDRA_ADMIN_TOKEN" }}'
            optional: true
      - name: AUTHENTICATORS_OAUTH2_INTROSPECTION_CONFIG_INTROSPECTION_REQUEST_HEADERS
        value: '{{ include "auth.adminAuth.introspectionHeaders" . }}'
    # Blocking first fetch: guarantees /etc/rules/access-rules.json exists (seeds "[]"
    # fail-closed after initRetries). tpl-rendered in the subchart context.
    extraInitContainers: |
      {{- $source := .Values.rules.source | default "legacy" }}
      {{- if and .Values.rulesSync.enabled (ne $source "maester") }}
      - name: rules-sync-init
        image: {{ .Values.rulesSync.image | quote }}
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -u
            URL="{{ .Values.rulesSync.url | default (printf "http://%s-jinbe:8080/api/oathkeeper/rules" .Release.Name) }}"
            DEST=/etc/rules/access-rules.json
            TMP=/etc/rules/.access-rules.init
            MAX={{ .Values.rulesSync.initRetries | default 30 }}
            n=0
            until curl -fsS --max-time 5 "$URL" -o "$TMP"; do
              n=$((n+1))
              if [ "$n" -ge "$MAX" ]; then
                echo "rules-sync-init: jinbe unreachable after ${n} tries; seeding [] (fail-closed)"
                printf '[]' > "$TMP"; mv "$TMP" "$DEST"; exit 0
              fi
              echo "rules-sync-init: fetch failed (try ${n}/${MAX}), retry in 2s"
              sleep 2
            done
            [ -s "$TMP" ] || printf '[]' > "$TMP"
            mv "$TMP" "$DEST"
            echo "rules-sync-init: wrote initial rules to ${DEST}"
        volumeMounts:
          - name: {{ include "oathkeeper.name" . }}-rules-volume
            mountPath: /etc/rules
            readOnly: false
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities: { drop: ["ALL"] }
          seccompProfile: { type: RuntimeDefault }
      {{- end }}
      {{- if or (eq $source "maester") (eq $source "dual") }}
      {{- $rulesFile := ternary "maester.json" "access-rules.json" (eq $source "dual") }}
      {{- if eq $source "dual" }}
      # dual: maester.json is maester's own file; seed it empty (fail-closed) so Oathkeeper can
      # load it before the first reconcile; 666 because maester runs as another UID. (maester
      # mode uses access-rules.json, created 666 by the subchart's init container.)
      - name: maester-seed
        image: {{ .Values.rulesSync.image | quote }}
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            [ -s /etc/rules/maester.json ] || printf '[]' > /etc/rules/maester.json
            chmod 666 /etc/rules/maester.json
        volumeMounts:
          - name: {{ include "oathkeeper.name" . }}-rules-volume
            mountPath: /etc/rules
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities: { drop: ["ALL"] }
          seccompProfile: { type: RuntimeDefault }
      {{- end }}
      - name: maester
        image: {{ .Values.maesterSidecar.image | quote }}
        imagePullPolicy: IfNotPresent
        restartPolicy: Always
        command: ["/manager"]
        args:
          - --metrics-addr=0.0.0.0:8080
          - sidecar
          - --rulesFilePath=/etc/rules/{{ $rulesFile }}
        env:
          # watch Rules in this namespace only (Role, not ClusterRole)
          - name: NAMESPACE
            value: {{ .Release.Namespace | quote }}
          # no *Available allow-lists: maester's defaults allow every handler; the
          # site-operator (and the Gateway CR) gate handlers, so ones enabled live work here too
        ports:
          - { name: maester-metrics, containerPort: 8080 }
        volumeMounts:
          - name: {{ include "oathkeeper.name" . }}-rules-volume
            mountPath: /etc/rules
        resources:
          {{- toYaml .Values.maesterSidecar.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities: { drop: ["ALL"] }
          seccompProfile: { type: RuntimeDefault }
      {{- end }}
    # Sidecar: poll jinbe every intervalSeconds; atomically mv only on sha256 change
    # (no fsnotify churn / needless reloads). Logs on change.
    extraContainers: |
      {{- if and .Values.rulesSync.enabled (ne (.Values.rules.source | default "legacy") "maester") }}
      - name: rules-sync
        image: {{ .Values.rulesSync.image | quote }}
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -u
            URL="{{ .Values.rulesSync.url | default (printf "http://%s-jinbe:8080/api/oathkeeper/rules" .Release.Name) }}"
            DEST=/etc/rules/access-rules.json
            TMP=/etc/rules/.access-rules.next
            INTERVAL={{ .Values.rulesSync.intervalSeconds | default 5 }}
            echo "rules-sync: polling ${URL} every ${INTERVAL}s -> ${DEST}"
            while true; do
              if curl -fsS --max-time 5 "$URL" -o "$TMP"; then
                if [ -s "$TMP" ]; then
                  new=$(sha256sum "$TMP" | cut -d' ' -f1)
                  cur=$(sha256sum "$DEST" 2>/dev/null | cut -d' ' -f1 || echo none)
                  if [ "$new" != "$cur" ]; then
                    mv "$TMP" "$DEST"
                    echo "rules-sync: rules changed -> updated ${DEST} (sha256=${new})"
                  fi
                fi
              else
                echo "rules-sync: fetch failed, keeping current rules"
              fi
              sleep "$INTERVAL"
            done
        volumeMounts:
          - name: {{ include "oathkeeper.name" . }}-rules-volume
            mountPath: /etc/rules
            readOnly: false
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities: { drop: ["ALL"] }
          seccompProfile: { type: RuntimeDefault }
        livenessProbe:
          exec: { command: ["/bin/sh", "-c", "test -f /etc/rules/access-rules.json"] }
          initialDelaySeconds: 10
          periodSeconds: 30
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits:   { memory: 32Mi }
      {{- end }}

  oathkeeper:
    helmTemplatedConfigEnabled: true
    # Rules come as a file in an emptyDir from the rules-sync sidecar (NOT a ConfigMap).
    # managedAccessRules MUST stay false so the subchart mounts /etc/rules as an emptyDir
    # + runs its built-in init, instead of mounting a rules ConfigMap. Keep
    # accessRulesOverride.nameOverride empty (default) for the same reason.
    managedAccessRules: false
    config:
      # CORS is delegated to ingress-nginx via the Ingress annotations
      # (see oathkeeper.ingress.proxy.annotations below). Ingress-nginx
      # is the only layer that can attach Access-Control-* headers to
      # error responses (401/403/500), which oathkeeper's rs/cors
      # middleware skips. Disabling here avoids duplicate headers from
      # two layers — browsers reject responses with two
      # Access-Control-Allow-Origin values.
      serve:
        proxy:
          cors:
            enabled: false
          # The default write timeout (120s) cuts every response stream at 2 min, kuma's SSE
          # included. 0s = no write deadline (as live on the sandbox); read/idle keep their
          # defaults (5s / 120s).
          timeout:
            write: 0s
      access_rules:
        matching_strategy: regexp
        # File mode + fsnotify hot-reload. The rules-sync sidecar (oathkeeper.rulesSync
        # below) polls jinbe and atomically rewrites this file on change, so Oathkeeper
        # reloads rules with NO pod restart. (An HTTP repo is fetched ONCE at boot,
        # which is why serving rules over HTTP required an Oathkeeper restart.)
        # The file follows oathkeeper.rules.source/active (see above); legacy renders
        # file:///etc/rules/access-rules.json exactly as before.
        repositories:
          # (with rules.publicSites the helper also emits a second inline:// item)
          - '{{ include "auth.oathkeeper.repositories" . }}'
      # Never log cookies, session tokens or Authorization (CONTROL S12/S15). trace/debug
      # dump full request headers; keep info outside a debugging session.
      log:
        level: info
        format: json
        leak_sensitive_values: false
      # Native OpenTelemetry (OBS-2.2). Off until `provider: otel` is set; the collector
      # endpoint is OTLP/HTTP host:port. Spans continue nginx's traceparent (parent-based).
      tracing:
        service_name: oathkeeper
        providers:
          otlp:
            server_url: otel-collector.otel:4318
            insecure: true
            sampling:
              sampling_ratio: 1.0
      authenticators:
        cookie_session:
          enabled: true
          config:
            check_session_url: 'http://{{ .Release.Name }}-kratos-public:80/sessions/whoami'
            preserve_path: true
            extra_from: "@this"
            subject_from: "identity.id"
            only:
              - ory_kratos_session
        noop:
          enabled: true
        # API token (Bearer) — scripts/CLIs holding a Kratos session token.
        # Reads X-Session-Token (NOT Authorization) so it can coexist with
        # oauth2_introspection on the same rule: Oathkeeper consults the first
        # authenticator that recognizes the credential FORMAT and stops there,
        # so both reading Authorization would shadow each other.
        # jinbe generates rules with this handler when a service enables the
        # "bearer" sign-in method (kuma → service → Sign-in methods).
        bearer_token:
          enabled: true
          config:
            check_session_url: 'http://{{ .Release.Name }}-kratos-public:80/sessions/whoami'
            preserve_path: true
            extra_from: "@this"
            subject_from: "identity.id"
            token_from:
              header: X-Session-Token
            # v25.4.0 does not pass the token to whoami unless told to: without this every
            # bearer call gets a 401 (the sandbox live config carries it)
            forward_http_headers:
              - X-Session-Token
        # OAuth2 access tokens (Authorization: Bearer) — third-party apps and
        # M2M API keys issued by Hydra, validated via token introspection.
        # Requires hydra.enabled=true; the "introspection" sign-in method in
        # kuma stays locked until this authenticator is enabled here AND
        # listed in jinbe's OATHKEEPER_ENABLED_AUTHENTICATORS.
        oauth2_introspection:
          enabled: true
          config:
            introspection_url: 'http://{{ .Release.Name }}-hydra-admin:4445/admin/oauth2/introspect'
            cache:
              enabled: true
              ttl: 60s
      authorizers:
        allow:
          enabled: true
        deny:
          enabled: true
        remote_json:
          enabled: true
          config:
            # /decision returns {allow, groups}. opa-authz-proxy emits
            # X-User-Groups from the server-side bindings (Redis via OPAL),
            # which the line below forwards to the upstream. This keeps
            # Kratos metadata_admin private (it is never exposed through
            # /sessions/whoami) while still giving upstreams the user's
            # groups header. Groups in the payload are intentionally
            # omitted — OPA reads them from data.bindings.group_membership.
            #
            # Oathkeeper template syntax is escaped with {{ "{{" }} ... {{ "}}" }}
            # so it survives the chart's tpl pass (helmTemplatedConfigEnabled
            # only resolves Helm directives like .Release.Name) and reaches
            # oathkeeper intact for per-request evaluation.
            remote: 'http://{{ .Release.Name }}-opa-authz-proxy:8080/v1/data/rbac/decision'
            payload: |
              {
                "input": {
                  "sub": "{{ "{{" }} print .Subject {{ "}}" }}",
                  "email": "{{ "{{" }} if .Extra.identity {{ "}}" }}{{ "{{" }} index .Extra.identity.traits "email" {{ "}}" }}{{ "{{" }} end {{ "}}" }}",
                  "object": "{{ "{{" }} .MatchContext.URL.Path {{ "}}" }}",
                  "action": "{{ "{{" }} .MatchContext.Method {{ "}}" }}",
                  "aal": "{{ "{{" }} if .Extra {{ "}}" }}{{ "{{" }} print .Extra.authenticator_assurance_level {{ "}}" }}{{ "{{" }} end {{ "}}" }}",
                  "client": {{ "{{" }} if .Extra {{ "}}" }}{{ "{{" }} if .Extra.client_id {{ "}}" }}true{{ "{{" }} else {{ "}}" }}false{{ "{{" }} end {{ "}}" }}{{ "{{" }} else {{ "}}" }}false{{ "{{" }} end {{ "}}" }}
                }
              }
            forward_response_headers_to_upstream:
              - X-User-Groups
      mutators:
        noop:
          enabled: true
        header:
          enabled: true
          config:
            # Header names use canonical case. Go's net/http canonicalizes
            # them anyway; defining the same header under both X-User-Id
            # and x-user-id produces a non-deterministic Set() race.
            # X-User-Groups is intentionally NOT set here — it comes from
            # the remote_json authorizer (server-side trusted source) via
            # forward_response_headers_to_upstream. The email template is
            # nil-safe so requests reaching this rule via the noop fallback
            # authenticator (no session) don't crash.
            headers:
              x-user-id: '{{ "{{" }} print .Subject {{ "}}" }}'
              x-user-email: '{{ "{{" }} if .Extra.identity {{ "}}" }}{{ "{{" }} index .Extra.identity.traits "email" {{ "}}" }}{{ "{{" }} end {{ "}}" }}'
      errors:
        # `unauthorized` (no Kratos session) is the only error that
        # still triggers a cross-host redirect to the login page —
        # everything else (`forbidden`, missing route_map match,
        # rule miss) returns the upstream status and lets
        # ingress-nginx hand the request over to the in-chart
        # error-page Service via custom-http-errors. That keeps
        # `kuma.{domain}/x` showing a 403 page on kuma.{domain}
        # rather than redirecting to auth.{domain}/login, which
        # used to cause an AAL2 step-up loop for already-logged-in
        # users hitting a route they don't have permission for.
        fallback: [redirect, json]
        handlers:
          redirect:
            enabled: true
            config:
              # Resolved against global.{domain,authDomain} via the chart's
              # tpl pass (helmTemplatedConfigEnabled). Oathkeeper appends
              # the original URL as ?return_to=... when return_to_query_param
              # is set, so the hard-coded query string from the upstream
              # chart's example is dropped.
              to: 'https://{{ default (printf "auth.%s" .Values.global.domain) .Values.global.authDomain }}/login'
              return_to_query_param: return_to
              when:
                - error: [unauthorized]
                  request:
                    header:
                      accept: [text/html]
          json:
            enabled: true
            config:
              verbose: false

  ingress:
    proxy:
      enabled: true
      className: ""
      # ingress-nginx is the canonical CORS source. Annotations below
      # cover ALL responses (including 401/403/500) since oathkeeper's
      # rs/cors-based middleware does not touch error paths.
      # The custom-http-errors=999 sentinel disables the cluster-wide
      # custom-http-errors list for THIS Ingress only — without it,
      # ingress-nginx ConfigMaps that route 4xx/5xx to a default error
      # backend strip the JSON body and CORS headers, leaving SPA
      # clients with "Failed to fetch" and no error.code visible.
      # Override `cors-allow-origin` with the actual origins; defaults
      # are derived from `global.{authDomain,appDomain}` via the
      # auth.corsAllowOrigin helper.
      annotations:
        nginx.ingress.kubernetes.io/enable-cors: "true"
        nginx.ingress.kubernetes.io/cors-allow-origin: "*"
        nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
        nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
        nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization, X-Request-ID, Cookie, X-Requested-With"
        nginx.ingress.kubernetes.io/cors-max-age: "600"
        # Route 401/403/404 to the in-chart error-page Service so the
        # browser sees a styled HTML page on the SAME host (e.g.
        # kuma.{domain}/403) instead of being redirected to
        # auth.{domain}/login for every authz error. 401 only fires
        # for requests that don't match the redirect handler's
        # text/html condition (XHR, fetch); HTML navigations still
        # get the cross-host /login redirect from Oathkeeper above.
        nginx.ingress.kubernetes.io/custom-http-errors: "401,403,404"
        # Points at the literal Service name from
        # templates/error-page/service.yaml. The oathkeeper subchart
        # ingress template renders annotations with toYaml (no tpl pass),
        # so this value cannot use {{ .Release.Name }} — the error-page
        # Service is intentionally named without a release prefix so the
        # annotation works under any release name.
        nginx.ingress.kubernetes.io/default-backend: error-page
      hosts:
        - host: auth.example.com
          paths:
            - path: /
              pathType: ImplementationSpecific
        - host: app.example.com
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls: []

  # Access rules - now served by Jinbe HTTP endpoint
  # If you still need a static ConfigMap fallback, provide inline JSON here
  # externalAccessRulesConfigMap: "my-access-rules-configmap"
  accessRules: ""

# Admin API tokens, rendered as Secret <release>-admin-tokens (templates/admin-auth/secret.yaml) with
# vault: references the Bank-Vaults secrets webhook rewrites (role vaultRole, through the namespace's
# default ServiceAccount). Read by kratos/hydra/oathkeeper.adminAuth. jinbe takes the same values
# through vault-env, e.g. jinbe.extraEnv:
#   KRATOS_ADMIN_TOKEN: vault:infra/data/<env>-jinbe#KRATOS_ADMIN_TOKEN
#   HYDRA_ADMIN_TOKEN:  vault:infra/data/<env>-jinbe#HYDRA_ADMIN_TOKEN
# Roll out in this order: jinbe with the tokens (harmless before any sidecar) -> oathkeeper.adminAuth
# -> kratos.adminAuth -> hydra.adminAuth.
# The Secret route needs the Bank-Vaults webhook's own identity to be accepted by vaultRole; where it is
# not (auth-dev), leave this empty and use vault: references in the pods themselves:
# kratos/hydra.adminAuth.token and oathkeeper.adminAuth.tokenRef.
adminAuthSecret:
  name: ""                # default <release>-admin-tokens
  vaultRole: ""
  kratosTokenRef: ""      # e.g. vault:infra/data/<env>#KRATOS_ADMIN_TOKEN
  hydraTokenRef: ""       # e.g. vault:infra/data/<env>#HYDRA_ADMIN_TOKEN

# =============================================================================
# Hydra - OAuth2 / OpenID Connect server (M2M client_credentials API keys)
# =============================================================================
# Opt-in. Disabled by default so existing consumers are unaffected. When
# enabled, Hydra issues OAuth2 clients used as scoped, per-organization API
# keys (grant_type=client_credentials). It MUST use its own database (do NOT
# share the Kratos schema). Provide DSN + secrets via your environment overlay
# (e.g. Vault), the same way Kratos is wired.
#
#   - secrets.system / DSN: inject via hydra.deployment.extraEnv referencing
#     your secret store (e.g. value: vault:secret/data/myapp#hydra-dsn).
#   - Access-token strategy: 'opaque' is recommended so deleting a client
#     revokes access on next introspection. Use 'jwt' only with short TTLs.
hydra:
  enabled: false

  # maester reconciles OAuth2Client CRDs; not needed when clients are created
  # via the Admin API by the customer-area backend. Disabled to reduce surface.
  maester:
    enabled: false

  # Public edge for the issuer host (templates/hydra/route.yaml): Hydra's own public paths go to
  # <release>-hydra-public:4444; jinbe's RFC 8414 metadata and /oauth2/register go through the
  # Oathkeeper proxy (rule mcp-oauth-as). Everything else on the host is a 404.
  # host: default the issuer's host. Gateway API (httpRoute) or nginx (ingress), as mcp. Not under
  # hydra.ingress, which is the Ory chart's own (whole-port) ingress.
  edge:
    host: ""
    httpRoute:
      enabled: false
      parentRefs: []
      labels: {}          # e.g. what an admission policy on routes expects
    ingress:
      enabled: false
      className: ""
      annotations: {}
      tls: []

  # Token-checking sidecar in front of the Hydra admin API, as kratos.adminAuth: serve.admin.host
  # 127.0.0.1, nginx on the pod IP:4445 requiring `Authorization: Bearer <HYDRA_ADMIN_TOKEN>`. Callers:
  # jinbe (HYDRA_ADMIN_TOKEN) and Oathkeeper's oauth2_introspection (oathkeeper.adminAuth) — enable
  # both first.
  adminAuth:
    enabled: false
    token: ""
    secretName: ""        # default <release>-admin-tokens
    secretKey: HYDRA_ADMIN_TOKEN
    image: nginxinc/nginx-unprivileged:1.27-alpine
    resources: {}

  deployment:
    extraContainers: |
      {{- include "auth.adminAuth.sidecar" (dict "root" . "port" .Values.hydra.config.serve.admin.port "key" "HYDRA_ADMIN_TOKEN") }}
    # Probes on the public port (see kratos.deployment.customReadinessProbe).
    customReadinessProbe:
      httpGet:
        path: /health/alive
        port: http-public
        httpHeaders:
          - name: Host
            value: "127.0.0.1"
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 5
    customStartupProbe:
      httpGet:
        path: /health/ready
        port: http-public
        httpHeaders:
          - name: Host
            value: "127.0.0.1"
      failureThreshold: 5
      successThreshold: 1
      periodSeconds: 1
      timeoutSeconds: 2
      initialDelaySeconds: 1

  hydra:
    automigration:
      enabled: true
    config:
      # dsn and secrets.system are intentionally empty here; supply them via
      # the environment overlay (extraEnv -> Vault) so they are never committed.
      dsn: ""
      secrets: {}
      serve:
        admin:
          # 127.0.0.1 while hydra.adminAuth fronts the admin port, else "" (all interfaces).
          host: '{{ include "auth.adminAuth.bindHost" . }}'
        cookies:
          same_site_mode: Lax
      # OAuth sign-in (MCP clients): the login and consent pages are login-ui's, backed by jinbe.
      # Templated from global.authDomain / global.domain (tpl-rendered by the Ory chart).
      urls:
        self:
          # Keep the trailing slash: the same string goes to auth-mcp, jinbe and login-ui
          # (auth.oauth.issuer), and the render fails without it.
          issuer: ""
        login: 'https://{{ include "auth.authDomain" . }}/oauth2/login'
        consent: 'https://{{ include "auth.authDomain" . }}/oauth2/consent'
        error: 'https://{{ include "auth.authDomain" . }}/error'
        logout: 'https://{{ include "auth.authDomain" . }}/logout'
        post_logout_redirect: 'https://{{ include "auth.authDomain" . }}/login'
      oauth2:
        expose_internal_errors: false
        pkce:
          enforced: true                 # every auth-code client; client_credentials unaffected
        grant:
          refresh_token:
            rotation_grace_period: 10s   # parallel refreshes from one client don't trip reuse detection
      oidc:
        dynamic_client_registration:
          enabled: false                 # jinbe's /oauth2/register is the only registration
      strategies:
        access_token: opaque
      ttl:
        access_token: 15m
        refresh_token: 168h              # 7-day idle, sliding with rotation
        login_consent_request: 15m
        auth_code: 5m
      log:
        level: info
        format: json

# =============================================================================
# OPAL - Policy Administration (Permit.io)
# =============================================================================
opal:
  enabled: true

  server:
    port: 7002
    # The opal images run as `opal` (uid 1000); runAsNonRoot needs the numeric uid.
    # No read-only root: the server clones the policy repo into the image filesystem.
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    # The RBAC policy repo. The policy uses the `import rego.v1` BRIDGE syntax:
    # it parses on pre-1.0 OPA engines AND OPA >= 1.0 strict mode, so the
    # opal-client/OPA image can be upgraded independently of the policy.
    # NEVER revert the policy to plain Rego v0 — an OPA >= 1.0 engine rejects
    # it at load and the whole gateway fails closed (total outage).
    policyRepoUrl: "https://github.com/w6d-io/policies.git"  # Default W6D RBAC policy
    policyRepoMainBranch: "main"
    pollingInterval: 30
    broadcastPgsql: false
    # Required only when uvicornWorkers > 1. Redis is password-protected
    # (redis.auth.enabled=true), so the broadcast URI MUST embed the password:
    #   redis://:<redis.auth.password>@<release>-redis-master:6379
    # Leaving it empty (single worker) means OPAL never connects to redis.
    broadcastUri: ""
    # Single worker → no need for inter-worker broadcast bus.
    # Increase + set broadcastUri when scaling.
    uvicornWorkers: 1
    replicas: 1
    # OPAL fetches RBAC data from Jinbe (external data source). The opal
    # subchart tpl-renders this value so {{ .Release.Name }} expands at
    # install time — no per-env override needed for the bundled topology.
    # Replace with a hard-coded URL only when pointing at an external
    # publisher.
    dataConfigSources:
      external_source_url: "http://{{ .Release.Name }}-jinbe:8080/api/admin/rbac/opal-datasource"

    # Init container that polls the data publisher (jinbe) until it serves
    # /api/admin/rbac/opal-datasource. Defends against the failure mode where
    # opal-server boots first, gets a 503, gives up, and leaves OPA with an
    # empty bindings dataset until a manual rollout restart.
    waitForDataSource:
      enabled: true
      url: ""  # Required when enabled — set per-release to the jinbe datasource URL
      image: "curlimages/curl:8.10.1"
      maxAttempts: 120  # 120 * 2s = 4 minutes total wait
      bearerToken: ""  # jinbe's OPAL client token (vault: ref) — required once jinbe guards its OPAL routes

  client:
    port: 7000
    opaPort: 8181
    # uid 1000 as for the server; no read-only root (the inline OPA writes bundles locally).
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    replicas: 1
    # NOTE: Must be overridden per-release since OPAL subchart doesn't support tpl
    # Use: --set opal.client.serverUrl=http://{release}-opal-server:7002
    serverUrl: ""  # Auto-computed by OPAL subchart if empty

    # Block opal-client Ready until OPA has loaded actual RBAC bindings from
    # the publisher. Without this, the client can be Ready while OPA's
    # dataset is empty, causing silent 403s for valid super-admin users.
    requireBindings:
      enabled: true
      path: "bindings/group_membership"  # OPA path that must contain at least one '@'
      failureThreshold: 60               # 60 * 5s = 5 min before pod is killed
      periodSeconds: 5

# =============================================================================
# Jinbe - RBAC API & OPA Bundle Server
# =============================================================================
jinbe:
  enabled: true
  replicaCount: 1

  serviceAccount:
    create: true
    name: ""
    token: false
    # Annotations added to the jinbe ServiceAccount. For the S3 backup feature
    # (backup.enabled) set an IRSA role-arn here granting s3:PutObject +
    # s3:GetObject + s3:ListBucket on the bucket, e.g.:
    #   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/auth-backup-role
    annotations: {}
  # Jinbe image — REQUIRED override unless your cluster has a pull secret for
  # the W6D registry. The default below is private; a public release (e.g.
  # ghcr.io/w6d-io/jinbe:vX.Y.Z) will be wired in once published.
  # Override examples:
  #   --set jinbe.image.repository=<your-registry>/jinbe
  #   --set jinbe.image.tag=latest
  image:
    repository: ghcr.io/w6d-io/jinbe
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  # Environment variables for Jinbe
  # Service URLs default to release-prefixed Kubernetes service names
  env:
    NODE_ENV: production
    APP_NAME: jinbe
    ENCRYPTION_KEY: ""  # REQUIRED - set in environment-specific values or Vault
    # OATHKEEPER_ENABLED_AUTHENTICATORS/-AUTHORIZERS/-MUTATORS/-ERROR_HANDLERS:
    # auto-derived from oathkeeper.oathkeeper.config by the
    # auth.oathkeeper.enabledEnv helper — never set them here (duplicate env).
    # jinbe validates every rule (CRUD, service sign-in methods, bundle import)
    # fail-closed against those sets.
    # REDIS_URL: auto-computed as redis://<release>-redis-master:6379
    # KRATOS_PUBLIC_URL: auto-computed as http://<release>-kratos-public:80
    # KRATOS_ADMIN_URL: auto-computed as http://<release>-kratos-admin:80
    # OPA_URL: auto-computed as http://<release>-opal-client:8181
    # OPAL_SERVER_URL: auto-computed as http://<release>-opal-server:7002
    # JINBE_INTERNAL_URL: auto-computed as http://<release>-jinbe:8080
    # OPA_AUTHZ_REMOTE: auto-computed as http://<release>-opa-authz-proxy:<port>/v1/data/rbac/allow
    # SERVICE_DEFAULT_NAMESPACE: auto-computed as .Release.Namespace
    # SERVICE_DEFAULT_DOMAIN: auto-computed as the chart's app domain (global.appDomain or app.<global.domain>)
    # SERVICE_DEFAULT_PORT: 8080
    # CORS_ORIGIN: auto-computed from global.appDomain and global.authDomain
    # ENABLE_SWAGGER: "false"
    # LOG_LEVEL: info
    # ADMIN_EMAIL: auto-created on first boot with super_admin access
    # ADMIN_PASSWORD: password for default admin (default: changeme123!)
    # ADMIN_NAME: display name for default admin
    # REDIS_AUDIT_MAXLEN: cap for the audit event stream (Redis XADD MAXLEN ~).
    #   Default 100000. Bounds retention of the audit log (Redis-only store).
    # KRATOS_WEBHOOK_SECRET: shared secret authenticating the Kratos auth-event
    #   web_hook -> /api/webhooks/kratos. Default is a Vault reference
    #   (vault:secret/data/auth#KRATOS_WEBHOOK_SECRET); it MUST resolve to the
    #   same value as the api_key set on the Kratos after-hooks above. Provide
    #   the secret via Vault (never a literal) and rotate both sides together.
    # OPA_TOKEN: bearer for OPA (the opal-client's OPAL_POLICY_STORE_AUTH_TOKEN), used by the
    #   admin access check. Vault ref, e.g. vault:secret/data/jinbe#OPA_TOKEN. Unset: the access
    #   check answers 503.
    # PROMETHEUS_URL: optional, e.g. http://prometheus-operated.monitoring:9090 — the kuma
    #   Home certificate panel reads cert-manager expiry metrics through jinbe. Unset: hidden.
    # AUDIT_HMAC_KEY: >= 32 chars, keys the HMACs that stand in for IPs / session ids in audit/v1.
    #   Vault ref, e.g. vault:secret/data/jinbe#AUDIT_HMAC_KEY. Unset: those fields are left out.

  # Prometheus metrics on their own port (never the app port Oathkeeper fronts). The container
  # port is always declared; a separate <release>-jinbe-metrics Service is rendered only for
  # the ServiceMonitor (observability.serviceMonitors.enabled). `token` (>= 16 chars, may be a
  # Vault ref) makes jinbe require it as a bearer; the ServiceMonitor then needs
  # observability.serviceMonitors.jinbe.bearerTokenSecret.
  metrics:
    port: 9464
    token: ""

  # OpenTelemetry traces (OBS-2.1): preloads jinbe's OTel SDK (http, fastify, pg, ioredis, undici).
  otel:
    enabled: false
    endpoint: "http://otel-collector.otel:4317"
    protocol: grpc          # grpc | http/protobuf (then use the collector's :4318)
    serviceName: jinbe
    # extra OTEL_RESOURCE_ATTRIBUTES, e.g. deployment.environment=auth-dev
    resourceAttributes: ""

  # Observability backends jinbe queries server-side for kuma (audit tab from Loki, ops logs,
  # Grafana deep links). Every key unset by default = feature off.
  observability:
    lokiUrl: ""                   # LOKI_URL, e.g. http://loki-gateway.loki
    lokiNamespace: ""             # LOKI_NAMESPACE: namespace label to scope ops-log queries
    lokiAuditSelector: ""         # LOKI_AUDIT_SELECTOR: json (jinbe default) | label
    grafanaUrl: ""                # GRAFANA_URL (browser links)

  # Vault KV path jinbe's Vault role reads (e.g. infra/data/jinbe-dev), used to build default
  # secret references such as captcha.secretKey. Empty: those secrets must be set explicitly.
  vaultPath: ""

  # PROTECTED_TRAITS: Kratos traits only an admin (or jinbe via the admin API) may set; the
  # gateway forwards them as trusted headers. Empty: jinbe default (person_uuid,applicant_uuid).
  # `email` is refused by jinbe.
  protectedTraits: []

  # Sign-in protection bot check (auth-guard). Which flows ask for it is a console setting;
  # this is WHO checks the answer. Rendered once `provider` or `siteKey` is set; unset = not
  # configured (a flow that asks for the check then follows the captcha fail mode).
  captcha:
    provider: ""            # CAPTCHA_PROVIDER: turnstile | hcaptcha | recaptcha
    siteKey: ""             # CAPTCHA_SITE_KEY (public)
    # CAPTCHA_SECRET_KEY: a Vault reference, never a literal. Empty:
    # vault:<jinbe.vaultPath>#CAPTCHA_SECRET_KEY (jinbe's own path, not the auth one).
    secretKey: ""
    # CAPTCHA_EXPECTED_HOSTNAMES (comma-separated). Empty: the auth domain (login-ui's host).
    expectedHostnames: ""
    verifyTimeoutMs: ""     # CAPTCHA_VERIFY_TIMEOUT_MS (jinbe default 3000)
    recaptchaMinScore: ""   # CAPTCHA_RECAPTCHA_MIN_SCORE (reCAPTCHA v3, jinbe default 0.5)
    allowTestKeys: ""       # CAPTCHA_ALLOW_TEST_KEYS: "true" lets provider test keys through

  # Sign-in gate (jinbe sign-in-protection/gate.ts). Kratos looks an address up and emails a code the
  # moment it is submitted, before any hook runs; enabled, jinbe's bootstrap routes POST
  # /self-service/{login,registration,recovery,verification,settings} on the auth domain through
  # jinbe, which requires the bot-check token (X-Captcha-Token, sent by login-ui) on every submit of a
  # checked flow, and applies the code limits, before Kratos. The bot check is on for every flow once
  # jinbe.captcha is configured (console toggles still switch flows off). Deploy the login-ui that
  # sends the header BEFORE enabling this.
  signInGate:
    enabled: false
    codesPerAddress: ""     # SIGN_IN_GATE_CODES_PER_ADDRESS (jinbe default 5 per window)
    codesPerIp: ""          # SIGN_IN_GATE_CODES_PER_IP (jinbe default 20 per window)
    windowSeconds: ""       # SIGN_IN_GATE_WINDOW_S (jinbe default 900)
    verifiedTtlSeconds: ""  # SIGN_IN_GATE_VERIFIED_TTL_S (jinbe default 300)

  # K8S config for m2m authentication
  k8s:
    enabled: false
    audience: jinbe
    email_domain: serviceaccount.cluster.local
    subjects: ""
    # optional; `acme-prod:*` also works
    # subjects: acme-prod:provisioner

  # Additional environment variables (map format: NAME: value).
  # DISABLE_CORS=true skips Fastify's @fastify/cors plugin since the
  # ingress-nginx layer is the canonical CORS source for the stack.
  # Without this flag jinbe and ingress-nginx both emit
  # Access-Control-* headers and browsers reject the duplicate.
  extraEnv:
    DISABLE_CORS: "true"

  # Pod annotations (e.g., for Vault integration)
  podAnnotations: {}

  # Pod-level securityContext applied to BOTH the jinbe Deployment pod and the
  # bootstrap Job pod. The image runs as `nodejs` (uid 1001, gid 65533); the uid
  # is spelled out because runAsNonRoot cannot verify a non-numeric image USER.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 65533
    seccompProfile:
      type: RuntimeDefault

  # Container-level securityContext applied to the jinbe container, the inline
  # bootstrap initContainer, and the standalone bootstrap Job container.
  # Read-only root: jinbe writes only /tmp (an emptyDir the template mounts) and,
  # when KRATOS_CONFIG_PATH is set, that file — mount it writable if you use it.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  resources:
    requests:
      cpu: 200m
      memory: 128Mi
    limits:
      # 1 core. 500m throttled jinbe's event loop under the gateway rule-poll +
      # admin-UI fan-out, pushing /api/health past the probe timeout. Raised so
      # health stays responsive under load.
      cpu: "1"
      memory: 512Mi

  # Health-probe tuning (consumed by jinbe/deployment.yaml). /api/health runs
  # light dependency checks and can be slow under load; a too-tight timeout was
  # SIGTERMing a busy-but-alive jinbe. Generous timeout + higher liveness
  # failureThreshold prevent restart flapping. Override per-env if needed.
  probes:
    timeoutSeconds: 5
    readiness:
      failureThreshold: 3
    liveness:
      failureThreshold: 6

  # NetworkPolicy — restrict who can reach jinbe Service. Defence in depth:
  # jinbe authenticates exclusively via Kratos session cookie now (the proxy-
  # header fallback was removed), but limiting peer connectivity prevents
  # rogue/compromised pods in the namespace from hitting admin endpoints
  # without first going through oathkeeper. Allowed peers by default:
  # oathkeeper, opal-server, opal-client, admin-ui (when enabled).
  # Set `enabled: false` if your CNI doesn't support NetworkPolicy.
  networkPolicy:
    enabled: true
    # extraIngress: list of NetworkPolicyPeer entries appended to the rule
    # (e.g. additional namespaceSelector / podSelector). Yaml-merge friendly.
    extraIngress: []

  # Bootstrap — runs `node dist/cli/bootstrap.js` as an initContainer on
  # every jinbe pod. Idempotent (Redis marker rbac:bootstrap:state); each
  # pod restart is a fast no-op once the marker exists.
  #
  # The initContainer is the canonical bootstrap path: it lets `helm install`
  # converge without a post-install hook (which would deadlock against
  # jinbe's readiness gate on the marker). Set standaloneJob: true to also
  # emit a separate Job manifest — useful when an ArgoCD pipeline wants a
  # discrete Sync-phase resource for ops visibility.
  bootstrap:
    enabled: true
    standaloneJob: false
    activeDeadlineSeconds: 600
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

# =============================================================================
# Redis - Data Store (Bitnami)
# =============================================================================
redis:
  enabled: true
  architecture: standalone
  image:
    registry: ghcr.io
    repository: w6d-io/redis
    tag: "8.2.2"
  # Password authentication (requirepass) — OPT-IN, DEFAULT OFF. Enabling it on
  # an EXISTING no-auth redis restarts the server AND requires wiring the OPAL
  # broadcaster password (see opal.server.broadcastUri); flip it per-env
  # deliberately, not as a blanket default. When enabled, every in-chart
  # consumer that connects to redis is wired to the SAME password:
  #   - jinbe: the auth.jinbe.env helper sources REDIS_PASSWORD from
  #     redis.auth.password below and embeds it in REDIS_URL, so overriding
  #     the password here alone propagates to jinbe (single source of truth).
  #   - OPAL server broadcaster: only connects to redis when
  #     opal.server.broadcastUri is set (uvicornWorkers > 1). It is empty by
  #     default so OPAL never touches redis; IF you set broadcastUri you MUST
  #     embed this password (see opal.server.broadcastUri).
  # Replace the placeholder before production, or point at an existing secret
  # via auth.existingSecret / auth.existingSecretPasswordKey. A `vault:` ref
  # does NOT work here — the bitnami redis subchart is not Vault-aware and
  # would set requirepass to the literal string.
  auth:
    enabled: false
    password: "changeme-redis-password"
  # Disable the bitnami subchart's own NetworkPolicy: its default is
  # allowExternal=true (accepts connections from any pod), and a second
  # co-located NetworkPolicy would be additive (union), so it could not
  # restrict anything. The parent chart ships a restrictive, release-pinned
  # NetworkPolicy instead (templates/redis/networkpolicy.yaml, gated by
  # redisNetworkPolicy.enabled) that allows only jinbe + OPAL pods.
  networkPolicy:
    enabled: false
  master:
    persistence:
      size: 1Gi

# Redis NetworkPolicy (parent-chart, defense-in-depth). Restricts ingress to
# the bundled redis to jinbe + OPAL server/client pods on the redis port. Kept
# OUT of the redis.* block so it does not collide with the bitnami subchart's
# networkPolicy schema. Set enabled=false if your CNI doesn't support
# NetworkPolicy. Only rendered when redis.enabled.
# Render redis.auth.existingSecret holding a vault: reference AS-IS (label mutate=skip). The redis
# POD resolves it with vault-env: the Bank-Vaults pod webhook follows secretKeyRef values (checked
# with a server dry-run on dev-aws-1), so the redis pod needs, in the bitnami values:
#   master.podAnnotations: the vault-addr / vault-role / vault-skip-verify annotations
#   serviceAccount: {create: false, name: <SA bound to the role>}, master.automountServiceAccountToken: true
#   master.livenessProbe/readinessProbe.enabled: false + master.customLivenessProbe/customReadinessProbe
#     exec `redis-cli -h localhost -p 6379 ping | grep -qE '^(PONG|NOAUTH)'` — the stock probes send the
#     raw reference (kubelet exec env) and redis-server overwrites /proc/1/environ.
# jinbe: set jinbe.env.REDIS_PASSWORD to a vault: ref its own role can read (otherwise it gets this
# Secret, whose reference jinbe's role may not be allowed to resolve). The OPAL broadcaster needs its
# own URL with the password (opal.server.broadcastUri).
redisAuthSecret:
  vaultRef: ""

redisNetworkPolicy:
  enabled: true
  # extraIngress: additional NetworkPolicyPeer entries appended to the rule.
  extraIngress: []

# =============================================================================
# OPA AuthZ Proxy - Translates OPA decisions into HTTP status codes
# =============================================================================
opaAuthzProxy:
  enabled: true
  # Every gateway decision goes through the proxy: one pod down = 500 for everyone after
  # 4 s (site-operator research R5). Two replicas + a PDB keep a rollout or a node drain
  # from taking the gateway down.
  replicaCount: 2
  pdb:
    enabled: true   # rendered only when replicaCount > 1
    minAvailable: 1

  image:
    repository: ghcr.io/w6d-io/infra/opa-authz-proxy
    # v0.4.0 forwards X-Tenant-Id into the OPA input and emits an
    # X-User-Organizations response header — DORMANT until a caller sends
    # X-Tenant-Id (none do yet). Retains v0.3.1 behaviour: HTTP 403 on deny
    # (oathkeeper's remote_json authorizer rejects any other status), and the
    # rego's decision.reason rides along as an `X-Authz-Reason` header for
    # upstreams that want to distinguish a route_map miss from a denial.
    tag: "v0.4.0"
    pullPolicy: IfNotPresent

  # Auto-computed from opal client service if empty
  opaUpstreamUrl: ""

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi

# =============================================================================
# Kratos Login UI
# =============================================================================
kratosLoginUi:
  # Public image at ghcr.io/w6d-io/kratos-login-ui:v0.2.0. Enabled by
  # default — the Oathkeeper rule `selfservice-ui` upstream points at
  # this Service, so auth/registration UI flows require it running.
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/w6d-io/kratos-login-ui
    pullPolicy: IfNotPresent
    tag: "v0.2.0"

  branding:
    appName: "My App"
    logoUrl: "/logo.svg"
    faviconUrl: "/favicon.ico"

  theme:
    primaryColor: "3B82F6"
    darkMode: true
    backgroundColor: "111827"

  # Cluster-internal jinbe URL (server-side only). The login UI calls jinbe on every sign-in:
  # the /two-step second-factor gate, the /welcome site list, /access reasons, branding.
  # Empty: http://<release>-jinbe:<port> whenever jinbe.enabled; set it for an external jinbe.
  jinbePublicUrl: ""

  # HYDRA_PUBLIC_URL (OAuth sign-in pages). Empty: the OAuth issuer (auth.oauth.issuer) whenever
  # mcp.enabled; set it to render it without mcp.
  hydraPublicUrl: ""

  # NAME: value, appended to the container env.
  extraEnv: {}

  # NEXT_PUBLIC_SECOND_FACTOR_GATE. Unset (default) = on: after sign-in, users who must have a
  # second factor (per jinbe) and have none are sent to /two-step to enrol. "false" turns the
  # gate off (e.g. while rolling out 2FA).
  secondFactorGate: ""

  # Admin console (kuma), linked from /welcome. Empty: https://<appDomain> (where the chart
  # serves kuma); set it when kuma has its own host (e.g. https://kuma.example.org).
  consoleUrl: ""

  kratos:
    browserUrl: "https://auth.example.com"
    publicUrl: ""  # Auto: http://<release>-kratos-public:80
    sessionCookie: ""  # KRATOS_SESSION_COOKIE: set with a non-default kratos session.cookie.name

  redirects:
    defaultReturnUrl: "https://app.example.com"
    # Comma-separated. In the login UI a `*` matches exactly ONE DNS label:
    # https://*.example.com covers app.example.com but not a.b.example.com — list deeper
    # zones explicitly (https://*.b.example.com). Kratos' own allowed_return_urls (above) is
    # a separate list and is not affected.
    allowedReturnUrls: "https://*.example.com"

  texts:
    loginTitle: "Welcome back"
    loginSubtitle: "Sign in to your account"
    registerTitle: "Create account"
    registerSubtitle: "Get started with your account"
    recoveryTitle: "Reset password"
    recoverySubtitle: "Enter your email to reset your password"

  footer:
    text: ""
    links: []

  service:
    type: ClusterIP
    port: 80
    targetPort: 3000

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5

  podAnnotations: {}
  # The image runs as `nextjs` (uid 1001). Read-only root works with the two
  # emptyDirs the template mounts (/app/.next/cache, /tmp) — checked against
  # kratos-login-ui:develop: /, /login, /api/health identical to a default run.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 65533
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  nodeSelector: {}
  tolerations: []
  affinity: {}

# =============================================================================
# PostgreSQL Simple - Lightweight Postgres (official image, no Bitnami)
# =============================================================================
# Use this when Bitnami images can't be pulled. Mutually exclusive with postgresql.
postgresqlSimple:
  enabled: true  # Set to false if using Bitnami postgresql or external DB
  image:
    repository: postgres
    tag: "16"
  auth:
    username: kratos
    # Only read at initdb (first start on an empty volume). In order of preference:
    #  - passwordVaultRef: a `vault:` reference put straight into POSTGRES_PASSWORD, resolved by
    #    vault-env in the pod (set podAnnotations to the Bank-Vaults role annotations, a
    #    serviceAccountName bound to that role and automountServiceAccountToken: true — vault-env
    #    logs in with the SA token). Do NOT rely on the Bank-Vaults secrets webhook rewriting a
    #    Secret: it logs into Vault with its own identity, which per-env roles do not accept.
    #  - existingSecret / existingSecretPasswordKey: a plain Secret.
    #  - password: literal placeholder for local use only.
    password: kratos
    passwordVaultRef: ""   # e.g. vault:infra/data/<env>#PG_SUPERUSER_PASSWORD
    existingSecret: ""
    existingSecretPasswordKey: postgres-password
    database: kratos
  podAnnotations: {}
  serviceAccountName: ""
  # No API access needed unless vault-env is used (passwordVaultRef): then true.
  automountServiceAccountToken: false
  # TLS: an init container generates a fresh self-signed P-256 certificate into a
  # memory emptyDir at every start (nothing to renew); postgres runs ssl=on, TLS>=1.2.
  # Clients use sslmode=require. hba (when set) replaces pg_hba.conf through
  # hba_file; `hostnossl all all all reject` makes TLS mandatory for network logins.
  tls:
    enabled: false
  hba: ""
  #  local   all all              trust
  #  host    all all 127.0.0.1/32 trust
  #  host    all all ::1/128      trust
  #  hostssl all all all          scram-sha-256
  #  hostnossl all all all        reject
  # Runs as the image's postgres user (uid 999, the owner of PGDATA) with no
  # capabilities and a read-only root (socket dir and /tmp are emptyDirs).
  # No fsGroup on purpose: kubelet's recursive chmod breaks PGDATA's 0700 mode.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# =============================================================================
# Error Page — inline 401/403/404 backend
# =============================================================================
# Tiny nginx Service that ingress-nginx points custom-http-errors at.
# Renders the same-host error pages so a forbidden request to
# kuma.{domain}/x returns HTML on kuma.{domain} instead of redirecting
# to auth.{domain}/login. Style is overridable via .branding.
errorPage:
  enabled: true
  replicaCount: 1
  image:
    repository: nginx
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  branding:
    appName: ""           # defaults to global.domain
    primaryColor: "#3B82F6"
    backgroundColor: "#111827"
    textColor: "#F9FAFB"
    homeUrl: ""           # defaults to https://{appDomain}
    supportEmail: ""
  # nginx as its `nginx` user (uid 101) on a read-only root; cache/run/tmp are
  # emptyDirs. Same responses as the root default (checked on 1.27-alpine).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 5m
      memory: 8Mi
    limits:
      cpu: 50m
      memory: 32Mi

# =============================================================================
# Admin UI (Kuma) - RBAC Management Dashboard
# =============================================================================
adminUi:
  # Public image at ghcr.io/w6d-io/kuma. Enabled by default so a fresh
  # install gets the RBAC dashboard out of the box; disable if you ship
  # your own admin UI.
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/w6d-io/kuma
    tag: v2.10.0
    pullPolicy: IfNotPresent
  env:
    # API_BASE → the SPA's API origin. Empty = same-origin (kuma is served
    # behind the same host/ingress as the API). Set to https://app.{domain}
    # only for a split-origin deployment.
    API_BASE: ""
    # AUTH_DOMAIN → substituted into kuma's index.html at container start
    # (envsubst → window.__AUTH_DOMAIN__); drives the 401 redirect target.
    # Empty auto-derives from global.authDomain (or auth.<global.domain>).
    AUTH_DOMAIN: ""
  extraEnv: {}
  podAnnotations: {}
  # kuma's image rewrites /usr/share/nginx/html/index.html at start (envsubst),
  # which needs root and a writable image. With readOnlyRootFilesystem an init
  # container (same image, same env) renders the html tree into an emptyDir and
  # nginx serves it as uid 101 (restricted profile). Checked on kuma:develop:
  # index.html byte-identical, /, /healthz and SPA routes unchanged.
  readOnlyRootFilesystem: true
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ─── Scheduled Backup + in-app restore ──────────────────────────────────────────
# When enabled, JINBE ITSELF exports the RBAC bundle on `schedule` and uploads it
# to s3://<bucket>/<prefix>/{timestamp}.json + a rolling latest.json (no external
# CronJob — jinbe is self-authenticated and holds the S3 creds). jinbe also reads
# the bucket so the kuma Backup tab can list snapshots + one-click restore, and a
# fresh install auto-restores from latest.json before seeding defaults.
#
# IAM (IRSA): annotate jinbe.serviceAccount.annotations with a role-arn granting
# s3:PutObject + s3:GetObject + s3:ListBucket on the bucket, e.g.:
#   jinbe:
#     serviceAccount:
#       annotations:
#         eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/auth-backup-role
backup:
  enabled: false
  schedule: "0 2 * * *"        # Daily at 02:00 UTC (jinbe-run, cron in UTC)
  s3:
    bucket: ""                  # Required when enabled=true
    prefix: "auth-backup"
    region: "eu-west-3"

# =============================================================================
# Sign-in protection (auth-guard) — gateway side
# =============================================================================
# The Kratos guard hooks live in kratos.kratos.config (registration: on; login: opt-in via
# examples/kratos-guard-login-values.yaml — it makes jinbe a hard dependency of sign-in).
kratosGuard:
  # A second Ingress for <authDomain>/self-service with an ingress-nginx per-client rate
  # limit (more specific than the Oathkeeper Ingress's `/`, same backend: the Oathkeeper
  # proxy). Needs ingress-nginx to see the real client IP (use-forwarded-headers /
  # proxy-protocol behind a load balancer), or every client shares one bucket.
  selfServiceRateLimit:
    enabled: false
    rpm: 30                  # nginx.ingress.kubernetes.io/limit-rpm, per client IP
    burstMultiplier: 5       # nginx.ingress.kubernetes.io/limit-burst-multiplier
    className: ""            # empty: oathkeeper.ingress.proxy.className
    tls: []                  # empty: the Oathkeeper proxy Ingress TLS entries covering the host

# =============================================================================
# Sites — plug a site from kuma (docs/SERVICE_PLUG.md). All OFF by default.
# =============================================================================
# jinbe keeps the Site intent and writes only `sites.auth.w6d.io` in its namespace;
# gatekit checks every pattern/overlap with the real Oathkeeper matcher; the
# site-operator turns Sites into maester Rule CRs (+ vanity Ingress/Certificate) and
# admission policies pin what those objects may contain.
sites:
  # jinbe side: SITES_KUBE=in-cluster, SITES_NAMESPACE, GATEKIT_URL, SITES_ZONES…, plus the
  # jinbe ServiceAccount RBAC (Role on sites, ClusterRole get/list/watch on zones).
  enabled: false
  # gatekit base URL for jinbe and the operator. Empty: http://<release>-gatekit:<port>
  # when gatekit.enabled.
  gatekitUrl: ""
  # Admin-defined wildcard zones. Rendered as cluster-scoped Zone CRs (siteOperator.enabled)
  # and as jinbe's SITES_ZONES. A site host must be exactly one DNS label under a zone.
  #   - name: dev
  #     domain: dev.example.com
  #     ingressClass: nginx            # optional, operator default otherwise
  #     tls: {mode: default}           # default | secret (secretName) | issuer (issuer)
  #     cookieDomain: .example.com   # optional, jinbe only (SSO coverage hint)
  zones: []
  # Hosts only system sites may use, on top of every oathkeeper.ingress.proxy host.
  reservedHosts: []
  # Kratos session cookie domain, for jinbe's SSO-coverage warning (SITES_COOKIE_DOMAIN).
  cookieDomain: ""
  # Namespaces no site upstream may point into (jinbe SITES_PLATFORM_NAMESPACES). Empty: jinbe default.
  platformNamespaces: []
  # Branded "no access / step up" page of kratos-login-ui (per-site 2FA, PX-1). Empty:
  # https://<authDomain>/access. Exposed to jinbe as SITES_ACCESS_URL for the per-rule
  # error handlers it renders into Site gates (Oathkeeper has a single global redirect
  # target, so the reason-based redirect can only be per rule).
  accessUrl: ""
  # Which applies need a second super_admin: off | high-risk | all (SITES_FOUR_EYES).
  fourEyes: "off"
  # Re-create missing/drifted Site CRs from the intent every … ms (0 = off).
  syncIntervalMs: 60000
  # How long an apply waits for RulesLoaded before rolling back.
  rulesLoadedTimeoutMs: 120000
  # Exact `namespace/service` exceptions to the platform-namespace upstream ban
  # (SITES_UPSTREAM_ALLOW), e.g. [auth-dev/echo]. Keep it short: each entry is a service
  # any site may expose.
  upstreamAllow: []
  # Environment name shown in kuma (SITES_ENV). Empty: jinbe uses NODE_ENV.
  env: ""
  # SITES_PRODUCTION: "true" on a production environment (stricter guards in kuma).
  # Empty: jinbe default (false).
  production: ""
  # SITES_MIXED_GATEWAY: "true" ONLY while the gateway loads the legacy rules AND the site
  # (maester) rules side by side (oathkeeper.rules.source=dual), so jinbe checks site routes
  # against legacy ones. jinbe refuses to start with it and SITES_PRODUCTION=true. Empty: false.
  mixedGateway: ""

# gatekit — stateless rule checker (compile · overlap · match · render). No egress.
gatekit:
  enabled: false
  replicaCount: 2
  image:
    repository: ghcr.io/w6d-io/gatekit
    tag: ""          # REQUIRED when enabled (no published release yet)
    pullPolicy: IfNotPresent
  service:
    port: 8080
  metricsPort: 9090
  maxBodyBytes: 1048576
  requestTimeout: 10s
  pdb:
    enabled: true    # rendered only when replicaCount > 1
    minAvailable: 1
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits:   { memory: 256Mi }
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# hydrator — the endpoint Oathkeeper's `hydrator` mutator calls (and Kratos's /resolve-org
# registration hook), in this release's namespace: set
# oathkeeper.oathkeeper.config.mutators.hydrator.config.api.url to http://<release>-hydrator/hydrate.
hydrator:
  enabled: false
  replicaCount: 1
  image: node:22-alpine
  tenantUrl: ""             # tenant service for /resolve-org; empty = never assigns an organization
  # Admin API tokens when kratos/hydra.adminAuth is on: vault: references resolved by vault-env
  # (then podAnnotations = the Bank-Vaults role annotations, serviceAccountName = an SA bound to
  # the role, automountServiceAccountToken: true).
  kratosAdminToken: ""
  hydraAdminToken: ""
  podAnnotations: {}
  serviceAccountName: ""    # default <release>-hydrator
  automountServiceAccountToken: false
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }

# mcp — auth-mcp, the admin MCP server: people use the console from an AI client, as themselves
# (a Hydra token narrowed to their permissions and one org). It holds no credential: its projected
# ServiceAccount token (audience jinbe.k8s.audience) goes to jinbe beside the user's token, and jinbe
# + OPA decide every call. Enabling it also sets on jinbe (every jinbe container):
#   K8S_SA_AUTH_ENABLED=true (+ <namespace>:<serviceAccount> appended to jinbe.k8s.subjects when set),
#   DELEGATED_TOKENS_ENABLED=true (the ceiling; MCP stays off until an administrator turns it on in
#   Settings -> AI assistants), DELEGATED_TOKEN_AUDIENCE and MCP_PUBLIC_URL = https://<host><path>,
#   DELEGATED_ACTOR_SUBJECTS=<namespace>:<serviceAccount>, MCP_UPSTREAM_URL = the Service below.
# jinbe's bootstrap then writes the Oathkeeper rule `mcp` (pass-through on <path> and
# /.well-known/oauth-protected-resource[<path>]); attach the host to the edge with httpRoute or ingress.
mcp:
  enabled: false
  host: ""            # default mcp.<global.domain>; DNS + certificate must cover it
  path: /mcp
  # The OAuth issuer (helper auth.oauth.issuer): auth-mcp HYDRA_ISSUER (protected-resource metadata),
  # jinbe MCP_OAUTH_ISSUER and login-ui HYDRA_PUBLIC_URL. Default: hydra.hydra.config.urls.self.issuer.
  # Must end with "/" like Hydra's `iss`.
  authorizationServer: ""
  # OAuth sign-in from MCP clients (jinbe /oauth2/register and the consent pages).
  oauth:
    dcrRate: ""           # MCP_OAUTH_DCR_RATE, jinbe default 10/h/ip,200/d
    providerCeiling: ""   # MCP_OAUTH_PROVIDER_CEILING, jinbe default 3000 calls/min per replica
  replicaCount: 2
  image:
    repository: ghcr.io/w6d-io/auth-mcp
    tag: ""           # REQUIRED when enabled (no published release yet)
    pullPolicy: IfNotPresent
  serviceAccount:
    name: auth-mcp    # jinbe's DELEGATED_ACTOR_SUBJECTS names it
  service:
    port: 3100
  readOnly: true      # write tools hidden and refused (MCP_READ_ONLY)
  allowedOrigins: []  # browser Origins allowed to call /mcp; native clients send none
  logLevel: info
  extraEnv: {}        # NAME: value (e.g. RATE_READS_PER_MIN, KILL_SWITCH_FILE)
  # jinbe verifies the actor token with TokenReview: bind jinbe's ServiceAccount to
  # system:auth-delegator. false where another release already does.
  tokenReviewBinding: true
  networkPolicy:
    enabled: true
  # Gateway API attachment (to the Oathkeeper proxy Service), e.g.
  #   parentRefs: [{kind: ListenerSet, name: zone-example, sectionName: https}]
  httpRoute:
    enabled: false
    parentRefs: []
  # nginx attachment. Keep custom-http-errors off this host (see templates/mcp/route.yaml).
  ingress:
    enabled: false
    className: ""
    annotations: {}
    tls: []
  pdb:
    enabled: true     # rendered only when replicaCount > 1
    minAvailable: 1
  resources:
    requests: { cpu: 20m, memory: 96Mi }
    limits:   { memory: 256Mi }
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Annotations added to every cluster-scoped object the chart renders (ClusterRoles,
# ClusterRoleBindings, ValidatingAdmissionPolicies and bindings, Zones, CRDs). Names already carry
# <namespace>-, so releases never collide. Under Argo CD, e.g.
#   argocd.argoproj.io/sync-options: Prune=false,Delete=false
# keeps them when the app is pruned or deleted.
clusterResources:
  annotations: {}

# site-operator — reconciles Site/Zone CRs into maester Rules, Ingresses, Certificates.
siteOperator:
  enabled: false
  replicaCount: 2    # leader election; the second pod is a warm standby
  image:
    repository: ghcr.io/w6d-io/site-operator
    tag: ""          # REQUIRED when enabled (no published release yet)
    pullPolicy: IfNotPresent
  # Ship the Site and Zone CRDs (auth.w6d.io). Set false where another release owns them.
  installCRDs: true
  # Render sites.zones as Zone objects (cluster-scoped). false: Zones are managed elsewhere (e.g. a
  # GitOps manifest); sites.zones still feeds jinbe's SITES_ZONES.
  installZones: true
  # Gateway settings CRD (gateways.auth.w6d.io) + operator RBAC on it. files/crds holds a
  # SNAPSHOT of site-operator's in-progress CRD (wave4/op3, uncommitted 2026-09-26): re-copy
  # once it lands. jinbe's Gateway RBAC comes with sites.enabled regardless.
  # When on, the operator owns Oathkeeper's handler sections (authenticators, authorizers,
  # mutators, errors) through the Gateway CR `default`:
  #   - the chart renders the full Oathkeeper config into <release>-oathkeeper-config-base
  #     (serve, log, access_rules, tracing…; handler sections there are replaced);
  #   - the subchart's <release>-oathkeeper-config stays the SEED: mounted before any Gateway,
  #     first rollback target, never touched by the operator;
  #   - the operator creates immutable <release>-oathkeeper-config-<hash8> ConfigMaps (keeps 3;
  #     not in the chart — Argo: IgnoreExtraneous / exclude label auth.w6d.io/gateway-config)
  #     and rolls auth-oathkeeper by changing the config volume's configMap.name and the
  #     pod-template annotation auth.w6d.io/gateway-config-hash (never templated here) →
  #     Argo needs ignoreDifferences on both (jqPathExpression selecting the volume
  #     oathkeeper-config-volume by name) + RespectIgnoreDifferences=true.
  # Requires oathkeeper.configmap.hashSumEnabled=false (no checksum tied to the seed). Handler
  # secrets stay in oathkeeper.deployment.extraEnv from a Secret (e.g.
  # AUTHENTICATORS_OAUTH2_INTROSPECTION_CONFIG_PRE_AUTHORIZATION_CLIENT_SECRET); the Gateway
  # refuses secret-looking keys.
  gateway:
    enabled: false
  # Zones on a Gateway API Gateway (site-operator >= 0d0cc6b): one HTTPRoute per host on the zone's
  # ListenerSet, routes admission (files/admission/route_policy.yaml). gateways: namespace/name of
  # the Gateways routes and ListenerSets may attach to (their policies run the WAF and CrowdSec).
  gatewayApi:
    enabled: false
    gateways: []                          # e.g. [envoy-gateway-system/eg]
    routeRequestTimeout: ""               # --route-request-timeout, e.g. 300s
  ingressClasses: [nginx]                 # first is the default
  # stamped on every Ingress the operator writes (must stay in the admission allow-list)
  ingressAnnotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/custom-http-errors: "599"
  issuers: [letsencrypt-prod]             # allowed ClusterIssuers, first is the default
  enableCertificates: true                # needs the cert-manager CRDs
  pausedRedirectUrl: ""
  # RulesLoaded condition: the operator reads GET /rules on every Oathkeeper pod of this
  # release (pods get/list RBAC; TCP 4456 from the operator). Needs an operator build with
  # --gateway-pod-selector/--gateway-api-port (site-operator OP-3); turn off for older images.
  rulesLoaded:
    enabled: true
  # NetworkPolicy on the Oathkeeper pods (rendered with siteOperator.enabled): proxy port open
  # to all, API port (GET /rules) only from the site-operator, metrics from Prometheus.
  # Not enforced on dev/prod today (aws-node network policy off).
  gatewayNetworkPolicy:
    enabled: true
    extraApiIngress: []
  extraArgs: []
  # Same regexes feed the operator flags and the admission params (kept in step).
  allowedUpstream: '^https?://[a-z]([a-z0-9-]*[a-z0-9])?\.[a-z0-9]([a-z0-9-]*[a-z0-9])?\.svc\.cluster\.local:[0-9]{1,5}$'
  deniedUpstream: '^https?://(([a-z0-9-]+-)?(kratos-admin|opa|opal-client|opal-server|redis|redis-master|postgres|postgresql|kubernetes)\.|[^/]*:(4434|8181|7002|6379|5432)$)'
  # ValidatingAdmissionPolicies (Sites, hosts under a Zone, Ingresses, maester Rules) for
  # the release namespace. Cluster-scoped objects, named after the namespace.
  admission:
    enabled: true
    # extra Rule writers besides the operator (GitOps-authored platform Rules)
    ruleWriters:
      - system:serviceaccount:argocd:argocd-application-controller
    ruleDeleters:
      - system:serviceaccount:kube-system:generic-garbage-collector
      - system:serviceaccount:kube-system:namespace-controller
    # Ingress annotations accepted in the gateway namespace, on top of the operator's own
    # (ingressAnnotations) and every key the chart's Ingresses use.
    allowedIngressAnnotations:
      - auth.w6d.io/spec-hash
      - auth.w6d.io/host
      - cert-manager.io/cluster-issuer
      - kubectl.kubernetes.io/last-applied-configuration
      - nginx.ingress.kubernetes.io/enable-cors
      - nginx.ingress.kubernetes.io/cors-allow-origin
      - nginx.ingress.kubernetes.io/cors-allow-credentials
      - nginx.ingress.kubernetes.io/cors-allow-methods
      - nginx.ingress.kubernetes.io/cors-allow-headers
      - nginx.ingress.kubernetes.io/cors-expose-headers
      - nginx.ingress.kubernetes.io/cors-max-age
      - nginx.ingress.kubernetes.io/custom-http-errors
      - nginx.ingress.kubernetes.io/proxy-read-timeout
      - nginx.ingress.kubernetes.io/proxy-send-timeout
      - nginx.ingress.kubernetes.io/proxy-body-size
      - nginx.ingress.kubernetes.io/default-backend
    allowedIngressAnnotationPrefixes: ["meta.helm.sh/", "argocd.argoproj.io/"]
    allowedDefaultBackend: error-page
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits:   { memory: 256Mi }
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# =============================================================================
# Observability — Prometheus Operator objects (kube-prometheus-stack)
# =============================================================================
observability:
  serviceMonitors:
    # ServiceMonitors for oathkeeper, kratos (admin), jinbe (metrics port), gatekit and
    # site-operator — each only when its component is enabled.
    enabled: false
    labels:
      release: monitoring
    interval: 30s
    scrapeTimeout: 10s
    # Namespace Prometheus scrapes from (jinbe NetworkPolicy opens the metrics port to it).
    prometheusNamespace: monitoring
    jinbe:
      # Secret holding jinbe.metrics.token, when set: {name: ..., key: ...}
      bearerTokenSecret: {}
