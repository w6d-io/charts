# Overlay: turn OFF the Kratos settings profile guard (protected traits). Profile saves keep
# only their audit hook. Use it while jinbe is older than 5297b87 (it answers flow:settings
# with 400, which would block every profile save). Apply on top of the env values:
#   helm ... -f values.yaml -f examples/kratos-guard-settings-off-values.yaml
kratos:
  kratos:
    config:
      selfservice:
        flows:
          settings:
            after:
              profile:
                hooks:
                - hook: web_hook
                  config:
                    url: '{{ tpl .Values.global.audit.webhook.url . }}'
                    method: POST
                    body: 'base64:'
                    response:
                      ignore: true
                    auth:
                      type: api_key
                      config:
                        name: X-Kratos-Webhook-Secret
                        in: header
                        value: '{{ .Values.global.audit.webhook.secret }}'
