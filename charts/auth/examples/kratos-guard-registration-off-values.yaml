# Overlay: turn OFF the Kratos registration guard (sign-in protection). password and code
# sign-ups keep only their audit hook (Helm cannot delete the chart's per-method lists with
# null for subchart values, so they are restated). Apply on top of the env values:
#   helm ... -f values.yaml -f examples/kratos-guard-registration-off-values.yaml
kratos:
  kratos:
    config:
      selfservice:
        flows:
          registration:
            after:
              password:
                hooks:
                - hook: web_hook
                  config:
                    url: '{{ tpl .Values.global.audit.webhook.url . }}'
                    method: POST
                    body: 'base64:'
                    response:
                      ignore: true
                    auth:
                      type: api_key
                      config:
                        name: X-Kratos-Webhook-Secret
                        in: header
                        value: '{{ .Values.global.audit.webhook.secret }}'
              code:
                hooks:
                - hook: web_hook
                  config:
                    url: '{{ tpl .Values.global.audit.webhook.url . }}'
                    method: POST
                    body: 'base64:'
                    response:
                      ignore: true
                    auth:
                      type: api_key
                      config:
                        name: X-Kratos-Webhook-Secret
                        in: header
                        value: '{{ .Values.global.audit.webhook.secret }}'
