# Overlay: turn ON the Kratos login guard (sign-in protection). Kratos then calls jinbe's
# guard before every sign-in session is issued (can_interrupt: jinbe may refuse), so jinbe
# becomes a HARD dependency of sign-in. Apply on top of the env values:
#   helm ... -f values.yaml -f examples/kratos-guard-login-values.yaml
# The list replaces login.after.hooks, so it repeats the audit hook after the guard.
# Body: base64 of login-guard.jsonnet (flow, method, requested_aal, captcha token, ip).
kratos:
  kratos:
    config:
      selfservice:
        flows:
          login:
            after:
              hooks:
                - hook: web_hook
                  config:
                    url: 'http://{{ .Release.Name }}-jinbe:8080/api/webhooks/kratos/guard'
                    method: POST
                    body: 'base64:'
                    can_interrupt: true
                    auth:
                      type: api_key
                      config:
                        name: X-Kratos-Webhook-Secret
                        in: header
                        value: '{{ .Values.global.audit.webhook.secret }}'
                - hook: web_hook
                  config:
                    url: '{{ tpl .Values.global.audit.webhook.url . }}'
                    method: POST
                    body: 'base64:'
                    response:
                      ignore: true
                    auth:
                      type: api_key
                      config:
                        name: X-Kratos-Webhook-Secret
                        in: header
                        value: '{{ .Values.global.audit.webhook.secret }}'
