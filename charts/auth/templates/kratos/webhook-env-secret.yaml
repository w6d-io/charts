{{- /*
Vault references in Kratos web_hook auth values. Bank-Vaults' vault-env substitutes environment
variables only, never files, so a `vault:<path>#<key>` api_key value in kratos.yaml (a ConfigMap)
reaches jinbe verbatim and every hook gets 401. For each such hook this Secret carries a Kratos
config override env var with the same reference; vault-env resolves it when the process starts and
Kratos merges env over the file leaf by leaf (arrays by index), so url/body/response stay from the
file. It holds references only, never a secret value, and is labelled so the Secret-mutating
webhook leaves it alone. Mounted through kratos.deployment.environmentSecretsName (envFrom on
Kratos and its automigrate init container).

An override at index i makes Kratos null every lower index it does not set, so lower hooks without
a Vault reference get a `_<i>_HOOK` entry that repeats their hook name.
*/ -}}
{{- define "auth.kratosWebhookEnv.hooks" -}}
{{- $root := .root -}}
{{- $last := -1 -}}
{{- range $i, $h := .hooks -}}
{{- if contains "vault:" (include "auth.kratosWebhookEnv.value" (dict "root" $root "hook" $h)) -}}
{{- $last = $i -}}
{{- end -}}
{{- end -}}
{{- range $i, $h := .hooks -}}
{{- if le $i $last -}}
{{- $v := include "auth.kratosWebhookEnv.value" (dict "root" $root "hook" $h) -}}
{{- if contains "vault:" $v -}}
{{- $_ := set $.env (printf "%s_%d_CONFIG_AUTH_CONFIG_VALUE" $.prefix $i) $v -}}
{{- else -}}
{{- $_ := set $.env (printf "%s_%d_HOOK" $.prefix $i) $h.hook -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- define "auth.kratosWebhookEnv.value" -}}
{{- $auth := (.hook.config | default dict).auth | default dict -}}
{{- $v := ($auth.config | default dict).value | default "" -}}
{{- if $v }}{{ tpl (toString $v) .root }}{{ end -}}
{{- end -}}

{{- if and .Values.kratos.enabled .Values.kratos.deployment.environmentSecretsName }}
{{- $env := dict }}
{{- $flows := ((.Values.kratos.kratos.config | default dict).selfservice | default dict).flows | default dict }}
{{- range $flow, $fcfg := $flows }}
{{- if kindIs "map" $fcfg }}
{{- range $phase := list "before" "after" }}
{{- $p := get $fcfg $phase }}
{{- if kindIs "map" $p }}
{{- range $k, $v := $p }}
{{- if eq $k "hooks" }}
{{- include "auth.kratosWebhookEnv.hooks" (dict "root" $ "env" $env "hooks" $v "prefix" (printf "SELFSERVICE_FLOWS_%s_%s_HOOKS" $flow $phase | upper)) }}
{{- else if and (kindIs "map" $v) (hasKey $v "hooks") }}
{{- include "auth.kratosWebhookEnv.hooks" (dict "root" $ "env" $env "hooks" $v.hooks "prefix" (printf "SELFSERVICE_FLOWS_%s_%s_%s_HOOKS" $flow $phase $k | upper)) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.kratos.deployment.environmentSecretsName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}
    app.kubernetes.io/component: kratos
    security.banzaicloud.io/mutate: skip
type: Opaque
{{- if $env }}
stringData:
  {{- range $k := keys $env | sortAlpha }}
  {{ $k }}: {{ get $env $k | quote }}
  {{- end }}
{{- end }}
{{- end }}
