{{- if .Values.mcp.enabled }}
{{/*
  auth-mcp holds no credential of its own: no Vault, no Secret. Its only token is the projected
  ServiceAccount token (audience jinbe.k8s.audience), sent to jinbe as X-Actor-Token beside the
  user's delegated token; neither works alone. It talks to jinbe only (token-info, key exchange,
  every tool call); jinbe and OPA decide everything.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "auth.mcp.serviceAccountName" . }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "auth.mcp.fullname" . }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      {{- include "auth.mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "auth.mcp.selectorLabels" . | nindent 8 }}
      {{- with .Values.mcp.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "auth.mcp.serviceAccountName" . }}
      # No Kubernetes API token: only the jinbe-audience token below.
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mcp
          image: "{{ .Values.mcp.image.repository }}:{{ required "mcp.image.tag is required" .Values.mcp.image.tag }}"
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy }}
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: {{ .Values.mcp.service.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.mcp.logLevel | quote }}
            - name: MCP_RESOURCE
              value: {{ include "auth.mcp.publicUrl" . | quote }}
            - name: HYDRA_ISSUER
              value: {{ include "auth.oauth.issuer" . | quote }}
            - name: TOKEN_VERIFIER
              value: jinbe
            - name: JINBE_URL
              value: {{ printf "http://%s:%d" (include "auth.jinbe.fullname" .) (int .Values.jinbe.service.port) | quote }}
            - name: ACTOR_TOKEN_PATH
              value: /var/run/secrets/tokens/jinbe/token
            - name: MCP_READ_ONLY
              value: {{ .Values.mcp.readOnly | quote }}
            - name: MCP_ALLOWED_ORIGINS
              value: {{ .Values.mcp.allowedOrigins | join "," | quote }}
            {{- range $name, $value := .Values.mcp.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - { name: http, containerPort: {{ .Values.mcp.service.port }}, protocol: TCP }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          {{- with .Values.mcp.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: jinbe-token
              mountPath: /var/run/secrets/tokens/jinbe
              readOnly: true
      volumes:
        - name: jinbe-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.jinbe.k8s.audience | quote }}
                  expirationSeconds: 3600
                  path: token
      {{- with .Values.mcp.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcp.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcp.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "auth.mcp.fullname" . }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP
  ports:
    - { name: http, port: {{ .Values.mcp.service.port }}, targetPort: http, protocol: TCP }
  selector:
    {{- include "auth.mcp.selectorLabels" . | nindent 4 }}
{{- if and .Values.mcp.pdb.enabled (gt (int .Values.mcp.replicaCount) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "auth.mcp.fullname" . }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  minAvailable: {{ .Values.mcp.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "auth.mcp.selectorLabels" . | nindent 6 }}
{{- end }}
{{- if .Values.mcp.tokenReviewBinding }}
---
# jinbe verifies auth-mcp's actor token with TokenReview.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s-token-review" .Release.Namespace (include "auth.jinbe.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "auth.jinbe.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
