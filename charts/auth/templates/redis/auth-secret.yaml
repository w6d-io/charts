{{- if and .Values.redis.enabled .Values.redis.auth.enabled .Values.redis.auth.existingSecret .Values.redisAuthSecret.vaultRef }}
{{- /*
  Password Secret for the bitnami redis subchart (redis.auth.existingSecret) holding only a vault:
  reference, kept as-is (mutate=skip: the secrets webhook cannot log into per-env roles). vault-env in
  the redis pod resolves it — see redisAuthSecret in values.yaml for the pod settings that requires.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.redis.auth.existingSecret }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ .Values.redis.nameOverride | default "redis" }}
    security.banzaicloud.io/mutate: skip
type: Opaque
stringData:
  {{ .Values.redis.auth.existingSecretPasswordKey | default "redis-password" }}: {{ .Values.redisAuthSecret.vaultRef | quote }}
{{- end }}
