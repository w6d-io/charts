{{- if and .Values.jinbe.enabled .Values.sites.enabled }}
{{- if not .Values.jinbe.serviceAccount.create }}
{{- fail "sites.enabled needs jinbe.serviceAccount.create=true (jinbe writes Site CRs under its own ServiceAccount)" }}
{{- end }}
{{/*
  jinbe writes Site intent only: no Ingress, Rule, Certificate, Service, ConfigMap or
  Secret, and no Site status (the operator owns it). Zones are cluster-scoped and managed
  by admins through jinbe (create, delete, and update for the zone's settings).
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "auth.jinbe.fullname" . }}-site-writer
  namespace: {{ include "auth.sites.namespace" . }}
  labels:
    {{- include "auth.jinbe.labels" . | nindent 4 }}
rules:
  - apiGroups: [auth.w6d.io]
    resources: [sites]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [auth.w6d.io]
    resources: [sites/status]
    verbs: [get]
  # Gateway settings (GW): the operator applies them; jinbe writes intent only
  - apiGroups: [auth.w6d.io]
    resources: [gateways]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [auth.w6d.io]
    resources: [gateways/status]
    verbs: [get]
  # unmanaged view: read the Oathkeeper config jinbe is pointed at (and, in Gateway mode, the
  # seed config the operator falls back to), those ConfigMaps only
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ include "auth.jinbe.gatewayConfigMap" . }}]
    verbs: [get]
  {{- if and .Values.siteOperator.gateway.enabled (ne (include "auth.jinbe.gatewayConfigMap" .) (include "auth.oathkeeper.configMapName" .)) }}
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ include "auth.oathkeeper.configMapName" . }}]
    verbs: [get]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "auth.jinbe.fullname" . }}-site-writer
  namespace: {{ include "auth.sites.namespace" . }}
  labels:
    {{- include "auth.jinbe.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "auth.jinbe.fullname" . }}-site-writer
subjects:
  - kind: ServiceAccount
    name: {{ include "auth.jinbe.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "auth.sites.clusterName" (dict "ctx" . "name" (printf "%s-zone-reader" (include "auth.jinbe.fullname" .))) }}
  {{- include "auth.clusterResources.annotations" (dict "ctx" .) | trim | nindent 2 }}
  labels:
    {{- include "auth.jinbe.labels" . | nindent 4 }}
rules:
  # admins manage Zones from kuma through jinbe (kube-sites.ts: list/get/create/delete, replace
  # for the zone's settings; the domain itself is immutable)
  {{- $zr := .Values.sites.zoneRbac | default dict }}
  {{- $verbs := $zr.verbs | default (list "get" "list" "watch" "create" "update" "delete") }}
  {{- if $zr.resourceNames }}
  {{- $named := list }}{{- $open := list }}
  {{- range $verbs }}{{- if has . (list "update" "patch" "delete") }}{{- $named = append $named . }}{{- else }}{{- $open = append $open . }}{{- end }}{{- end }}
  {{- if $open }}
  - apiGroups: [auth.w6d.io]
    resources: [zones]
    verbs: [{{ join ", " $open }}]
  {{- end }}
  {{- if $named }}
  - apiGroups: [auth.w6d.io]
    resources: [zones]
    resourceNames: [{{ join ", " $zr.resourceNames }}]
    verbs: [{{ join ", " $named }}]
  {{- end }}
  {{- else }}
  - apiGroups: [auth.w6d.io]
    resources: [zones]
    verbs: [{{ join ", " $verbs }}]
  {{- end }}
  # host-collision pre-check before a site is saved: read-only, every namespace
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list]
  {{- if .Values.siteOperator.gatewayApi.enabled }}
  # the same pre-check for Gateway API hosts, and the route-policy view (read-only)
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes, listenersets]
    verbs: [get, list]
  - apiGroups: [gateway.envoyproxy.io]
    resources: [securitypolicies, envoyextensionpolicies]
    verbs: [get, list]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "auth.sites.clusterName" (dict "ctx" . "name" (printf "%s-zone-reader" (include "auth.jinbe.fullname" .))) }}
  {{- include "auth.clusterResources.annotations" (dict "ctx" .) | trim | nindent 2 }}
  labels:
    {{- include "auth.jinbe.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "auth.sites.clusterName" (dict "ctx" . "name" (printf "%s-zone-reader" (include "auth.jinbe.fullname" .))) }}
subjects:
  - kind: ServiceAccount
    name: {{ include "auth.jinbe.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
