{{- if .Values.adminUi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "auth.fullname" . }}-admin-ui
  labels:
    app.kubernetes.io/component: admin-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.adminUi.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: admin-ui
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: admin-ui
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- with .Values.adminUi.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.adminUi.readOnlyRootFilesystem }}
      # kuma never calls the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      # The image's own CMD rewrites index.html in place (root + writable image).
      # Render the same html tree into an emptyDir instead; nginx serves it read-only.
      initContainers:
        - name: render-html
          image: "{{ .Values.adminUi.image.repository }}:{{ .Values.adminUi.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.adminUi.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              cp -R /usr/share/nginx/html/. /out/
              envsubst '${API_BASE} ${AUTH_DOMAIN} ${GRAFANA_URL} ${BACKUP_ENABLED} ${OIDC_AUTHORITY} ${OIDC_CLIENT_ID} ${OIDC_AUDIENCE} ${ORG_AUTHORITY} ${KRATOS_PUBLIC_URL} ${ORG_DIRECTORY_AUDIENCE} ${ORG_DIRECTORY_URL} ${ORG_SELECTION_URL} ${MCP_SERVER_URL} ${LOGO_URL} ${LOGO_DARK_URL} ${LOGO_SMALL_URL} ${FAVICON_URL} ${APP_NAME} ${MCP_SERVER_NAME}' \
                < /usr/share/nginx/html/index.html > /out/index.html
          env:
            {{- include "auth.adminUi.env" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
          volumeMounts:
            - name: html
              mountPath: /out
      {{- end }}
      containers:
        - name: admin-ui
          image: "{{ .Values.adminUi.image.repository }}:{{ .Values.adminUi.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.adminUi.image.pullPolicy }}
          {{- if .Values.adminUi.readOnlyRootFilesystem }}
          command: ["nginx"]
          args: ["-g", "daemon off;"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.adminUi.containerPort | default 8080 }}
              protocol: TCP
          env:
            {{- include "auth.adminUi.env" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          {{- with .Values.adminUi.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.adminUi.readOnlyRootFilesystem }}
      volumes:
        - name: html
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
      {{- end }}
{{- end }}
