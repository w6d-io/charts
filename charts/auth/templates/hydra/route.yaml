{{- if .Values.hydra.enabled }}
{{/*
  The OAuth issuer host. Hydra's own public paths go straight to Hydra's public Service; jinbe's
  RFC 8414 metadata and /oauth2/register go through Oathkeeper (rule mcp-oauth-as, Host kept).
  Anything else on the host matches nothing: 404 (no device flow, /userinfo or admin paths).
  Two HTTPRoutes because the routes admission (route_policy.yaml) lets exactly one named route reach
  Hydra, with that Service as its only backend.
*/}}
{{- $publicSvc := printf "%s-hydra-public" .Release.Name }}
{{- $proxySvc := printf "%s-oathkeeper-proxy" .Release.Name }}
{{- with .Values.hydra.edge.httpRoute }}
{{- if .enabled }}
{{- $host := include "auth.hydra.edgeHost" $ }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "auth.hydra.publicRouteName" $ }}
  labels:
    {{- include "auth.labels" $ | nindent 4 }}
    app.kubernetes.io/component: hydra-public
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  parentRefs:
    {{- required "hydra.edge.httpRoute.parentRefs is required when hydra.edge.httpRoute.enabled" .parentRefs | toYaml | nindent 4 }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - matches:
        {{- range splitList "\n" (include "auth.hydra.publicPaths" $) }}
        {{- $p := splitList " " . }}
        - method: {{ first $p }}
          path: { type: Exact, value: {{ last $p }} }
        {{- end }}
      backendRefs:
        - name: {{ $publicSvc }}
          port: 4444
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-hydra-oauth-as" (include "auth.fullname" $) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "auth.labels" $ | nindent 4 }}
    app.kubernetes.io/component: hydra-oauth-as
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  parentRefs:
    {{- toYaml .parentRefs | nindent 4 }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - matches:
        - method: GET
          path: { type: Exact, value: /.well-known/oauth-authorization-server }
        - method: POST
          path: { type: Exact, value: /oauth2/register }
      backendRefs:
        - name: {{ $proxySvc }}
          port: 4455
---
{{- end }}
{{- end }}
{{- with .Values.hydra.edge.ingress }}
{{- if .enabled }}
{{- $host := include "auth.hydra.edgeHost" $ }}
{{/* nginx: Exact paths per backend (methods are not matched; Hydra and the rule refuse the rest). */}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "auth.hydra.publicRouteName" $ }}
  labels:
    {{- include "auth.labels" $ | nindent 4 }}
    app.kubernetes.io/component: hydra-public
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range splitList "\n" (include "auth.hydra.publicPaths" $) | uniq }}
          - path: {{ last (splitList " " .) }}
            pathType: Exact
            backend:
              service:
                name: {{ $publicSvc }}
                port:
                  number: 4444
          {{- end }}
          {{- range list "/.well-known/oauth-authorization-server" "/oauth2/register" }}
          - path: {{ . }}
            pathType: Exact
            backend:
              service:
                name: {{ $proxySvc }}
                port:
                  number: 4455
          {{- end }}
{{- end }}
{{- end }}
{{- end }}
