{{- $s := .Values.adminAuthSecret }}
{{- if and $s.vaultRole (or $s.kratosTokenRef $s.hydraTokenRef) }}
{{- /*
  The admin API tokens (kratos/hydra/oathkeeper.adminAuth read it), holding only vault: references.
  The Bank-Vaults secrets webhook rewrites them at admission (role vaultRole, resolved through the
  namespace's default ServiceAccount; failurePolicy Ignore, so check the stored value no longer starts
  with `vault:`). ArgoCD will show the data as drifted — expected. The name must match the subcharts'
  adminAuth.secretName (default <release>-admin-tokens on both sides).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s.name | default (printf "%s-admin-tokens" .Release.Name) }}
  labels:
    app.kubernetes.io/component: admin-auth
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    vault.security.banzaicloud.io/vault-addr: {{ .Values.global.vault.address | quote }}
    vault.security.banzaicloud.io/vault-role: {{ $s.vaultRole | quote }}
    vault.security.banzaicloud.io/vault-skip-verify: "true"
type: Opaque
stringData:
  {{- with $s.kratosTokenRef }}
  KRATOS_ADMIN_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with $s.hydraTokenRef }}
  HYDRA_ADMIN_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
