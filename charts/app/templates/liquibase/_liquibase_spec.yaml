{{/*
  app initContainer migration — now delegated to the shared `liquibase` library chart.
  Behaviour is unchanged: single DB, admin creds from the dlm-provisioned k8s secret.
  (Image helpers + container spec live in charts/liquibase.)
*/}}
{{- include "liquibase.container" (dict
      "ctx" .
      "creds" "secret"
      "secretName" (printf "%s-db" (include "app.names.name" .))
      "adminuser" .Values.database.adminuser) -}}
