{{- if .Values.multiTenantMigration.enabled }}
{{- $mt := .Values.multiTenantMigration }}
{{- $kt := "" }}{{- if .Values.kafka }}{{- $kt = .Values.kafka.tenants | default "" }}{{- end }}
{{- $tenants := $mt.tenants | default $kt }}
{{- $name := printf "%s-migration" (include "app.names.name" .) }}
{{- $sa := default $name $mt.controller.serviceAccountName }}
{{- $runId := (.Values.image.tag | toString | replace "." "-" | replace "+" "-" | lower) | default (printf "r%d" (.Release.Revision | int)) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-controller" $name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ include "app.names.name" . | quote }}
    app.kubernetes.io/component: migration-controller
  annotations:
    # Runs before the app Sync; wave 0 is after the rbac/configmap (wave -1).
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ $mt.controller.activeDeadlineSeconds | default 3600 }}
  ttlSecondsAfterFinished: {{ $mt.controller.ttlSecondsAfterFinished | default 600 }}
  template:
    metadata:
      annotations:
        # linkerd reads this as an ANNOTATION; a sidecar would keep this Job from completing.
        linkerd.io/inject: disabled
      labels:
        app.kubernetes.io/component: migration-controller
    spec:
      serviceAccountName: {{ $sa | quote }}
      restartPolicy: Never
      volumes:
        - name: scripts
          configMap:
            name: {{ printf "%s-migration-scripts" (include "app.names.name" .) | quote }}
            defaultMode: 0755
      containers:
        - name: controller
          image: {{ $mt.controller.image | quote }}
          command: ["bash", "/scripts/migrate.sh"]
          env:
            # Tenant identifiers (comma/space/newline separated). Taken from
            # multiTenantMigration.tenants, falling back to .Values.kafka.tenants.
            - name: TENANTS
              value: {{ $tenants | quote }}
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CHILD_TPL
              value: /scripts/job.tpl.yaml
            - name: RUN_ID
              value: {{ $runId | quote }}
            - name: BATCH_SIZE
              value: {{ $mt.batchSize | quote }}
            - name: FAIL_THRESHOLD_PCT
              value: {{ $mt.failThresholdPct | quote }}
            - name: JOB_TIMEOUT
              value: {{ $mt.jobTimeoutSeconds | quote }}
            - name: FAIL_FAST
              value: {{ $mt.failFast | default false | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
{{- end }}
