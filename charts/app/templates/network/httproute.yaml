{{- if .Values.httproute.enabled }}
{{- $fullname := include "app.names.fullname" . -}}
{{- $svcPort := .Values.service.externalPort -}}
{{- $host := .Values.httproute.host }}
{{- $path := .Values.httproute.path }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "helper.labels.standard" . | nindent 4 }}
    {{- with .Values.httproute.labels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httproute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- if .Values.httproute.parentRefs }}
    {{- toYaml .Values.httproute.parentRefs | nindent 4 }}
    {{- else if .Values.listenerset.enabled }}
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ $fullname }}
      namespace: {{ .Release.Namespace }}
      sectionName: {{ .Values.listenerset.listenerName }}
    {{- end }}
  {{- if .Values.httproute.hostnames }}
  hostnames:
    {{- toYaml .Values.httproute.hostnames | nindent 4 }}
  {{- else if .Values.listenerset.enabled }}
  hostnames:
    - {{ tpl (.Values.listenerset.hostname ) $ | quote }}
  {{- end }}
  rules:
  {{- range .Values.httproute.rules }}
  - backendRefs:
    {{- range .backendRefs }}
    - group: ''
      kind: Service
      name: {{ .name | default $fullname }}
      {{- with .namespace }}
      namespace: {{ . }}
      {{- end }}
      port: {{ .port | default $svcPort }}
      weight: 1
    {{- end }}
    {{- with .matches }}
    matches:
    {{- range . }}
      - path:
          type: {{ .path.type | default "PathPrefix" }}
          value: {{ .path.value | default $path }}
    {{- end }}
    {{- end }}
    {{- with .filters }}
    filters:
    {{- range . }}
      - {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
